name: r1-akron-money-context-profile

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-money-context-profile.yml"
      - "experiments/akron-2026/r1_t8_money_facts.json"
      - "experiments/akron-2026/profile_money_context.py"
      - "experiments/akron-2026/profile_attachment_evidence.py"
      - "experiments/akron-2026/onbase-plan.json"
      - "experiments/akron-2026/R1_T9_MONEY_CONTEXT_PROFILE.md"
      - "tests/test_akron_money_context_profile.py"
      - "src/proofline/onbase_attachments.py"
      - "src/proofline/progressive.py"
      - "src/proofline/ocr.py"
      - "src/proofline/structured.py"
      - "src/proofline/review.py"
      - "src/proofline/watch_storage.py"
      - "src/proofline/storage.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest

      - name: Ensure bounded OCR capability is present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version | head -1

      - name: Rebuild the exact bounded production evidence state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p akron-money-context
          proofline-onbase-attachments \
            --state-dir .akron-money-context \
            --manifest-out akron-money-context/attachment-manifest.json \
            --relations-out akron-money-context/discovered-relations.json \
            --rejections-out akron-money-context/rejections.json \
            --sync-limit 8 \
            experiments/akron-2026/onbase-plan.json \
            > akron-money-context/sync.json

      - name: Reproduce preferred Silver and OCR through the current extraction pipeline
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/profile_attachment_evidence.py \
            --state-dir .akron-money-context \
            --output akron-money-context/t8-evidence-profile.json \
            --threshold 0.70 \
            --ocr \
            --language eng \
            --dpi 200 \
            > akron-money-context/t8-profile-stdout.json

      - name: Restore the frozen v1 structured fact contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from proofline.structured import StructuredIndex

          result = StructuredIndex(Path('.akron-money-context')).rebuild(
              parser_version='proofline-structured/v1'
          )
          if result.parser_version != 'proofline-structured/v1':
              raise SystemExit(f'failed to restore frozen parser contract: {result.parser_version}')
          Path('akron-money-context/v1-structured-build.json').write_text(
              json.dumps(result.to_dict(), indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result.to_dict(), indent=2, sort_keys=True))
          PY

      - name: Emit frozen money-fact local Silver contexts
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/profile_money_context.py \
            --state-dir .akron-money-context \
            --frozen experiments/akron-2026/r1_t8_money_facts.json \
            --output akron-money-context/money-context-profile.json \
            --context-chars 320 \
            > akron-money-context/context-profile-stdout.json

      - name: Validate exact reproduction without semantic role assignment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('akron-money-context')
          sync = json.loads((root / 'sync.json').read_text())
          t8 = json.loads((root / 't8-evidence-profile.json').read_text())
          v1_build = json.loads((root / 'v1-structured-build.json').read_text())
          profile = json.loads((root / 'money-context-profile.json').read_text())
          frozen = json.loads(Path('experiments/akron-2026/r1_t8_money_facts.json').read_text())
          rejections = json.loads((root / 'rejections.json').read_text())

          expected_signature = '6e9ea2cc4c6e219c749e65ebc9b068b998ca5776159f37415268237b43ed3df0'
          if frozen.get('signature_sha256') != expected_signature:
              raise SystemExit('frozen T8 money population signature changed')
          if frozen.get('fact_count') != 31 or len(frozen.get('facts') or []) != 31:
              raise SystemExit('frozen T8 money population is no longer 31 facts')
          if len(frozen.get('sources') or {}) != 7:
              raise SystemExit('frozen T8 money source population is no longer 7 sources')
          if rejections:
              raise SystemExit(f'T9 bounded state contains rejected publisher links: {len(rejections)}')

          attachment_sync = sync.get('attachment_sync') or {}
          counts = (attachment_sync.get('watch') or {}).get('counts') or {}
          if attachment_sync.get('resource_count') != 8:
              raise SystemExit(f"T9 bounded source sample changed size: {attachment_sync.get('resource_count')}")
          if counts.get('new') != 8 or counts.get('unavailable') != 0:
              raise SystemExit(f'T9 fresh bounded attachment sync failed: {counts}')

          if t8.get('schema') != 'proofline-akron-attachment-evidence-profile/v1':
              raise SystemExit('T8 reproduction profile schema changed')
          if len(t8['post_ocr']['facts']['money']) != 31:
              raise SystemExit('current parser no longer yields 31 preferred money facts on the frozen sample')
          if t8['ocr']['failed'] != 0:
              raise SystemExit(f"T8 reproduction OCR failed: {t8['ocr']['failures']}")
          if t8['post_ocr']['structured_build']['parser_version'] != 'proofline-structured/v2':
              raise SystemExit('current extraction profile did not use structured parser v2')
          if v1_build.get('parser_version') != 'proofline-structured/v1':
              raise SystemExit('historical T9 reproduction was not rebuilt with parser v1')

          if profile.get('schema') != 'proofline-akron-money-context-profile/v1':
              raise SystemExit('unexpected T9 context profile schema')
          if profile.get('stage') != 'context_characterization_only':
              raise SystemExit('T9 stage boundary changed')
          if profile.get('semantic_roles_assigned') is not False:
              raise SystemExit('T9 assigned semantic roles before the context evidence was characterized')

          reproduction = profile['reproduction']
          if reproduction['source_count'] != 7 or reproduction['fact_count'] != 31:
              raise SystemExit(f'wrong T9 frozen population: {reproduction}')
          if reproduction['signature_sha256'] != expected_signature:
              raise SystemExit('T9 current preferred-Silver population differs from frozen signature')
          if not all(
              reproduction[key]
              for key in (
                  'exact_fact_population_match',
                  'exact_source_artifact_match',
                  'exact_token_anchor_match',
              )
          ):
              raise SystemExit(f'T9 exact reproduction failed: {reproduction}')

          contexts = profile['contexts']
          if len(contexts) != 31:
              raise SystemExit(f'T9 emitted {len(contexts)} contexts instead of 31')
          for context in contexts:
              if context['token'] != context['raw_text']:
                  raise SystemExit('a frozen money token lost its exact Silver anchor')
              if not context.get('evidence_id') or not context.get('page_text_sha256'):
                  raise SystemExit('a T9 context lost Silver provenance')
              if len(context.get('context_sha256') or '') != 64:
                  raise SystemExit('a T9 context lost its byte-level context hash')
              if 'role' in context:
                  raise SystemExit('T9 context output contains premature semantic role labels')

          summary = {
              'source_count': reproduction['source_count'],
              'fact_count': reproduction['fact_count'],
              'frozen_signature_sha256': expected_signature,
              'current_parser_version': t8['post_ocr']['structured_build']['parser_version'],
              'historical_parser_version': v1_build['parser_version'],
              'unique_page_count': profile['preferred_silver']['unique_page_count'],
              'fact_method_counts': profile['preferred_silver']['fact_method_counts'],
              'minimum_quality_score': profile['preferred_silver']['minimum_quality_score'],
              'maximum_quality_score': profile['preferred_silver']['maximum_quality_score'],
              'context_chars': profile['context_chars'],
              'semantic_roles_assigned': profile['semantic_roles_assigned'],
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload frozen money-context evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-money-context-profile
          path: akron-money-context/
          if-no-files-found: error
          retention-days: 14
