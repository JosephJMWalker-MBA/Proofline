name: r1-akron-money-parser-integrity

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-money-parser-integrity.yml"
      - ".github/workflows/r1-akron-money-context-profile.yml"
      - "experiments/akron-2026/R1_T10_MONEY_PARSER_INTEGRITY.md"
      - "experiments/akron-2026/measure_money_parser_delta.py"
      - "experiments/akron-2026/profile_attachment_evidence.py"
      - "experiments/akron-2026/r1_t8_money_facts.json"
      - "experiments/akron-2026/onbase-plan.json"
      - "tests/test_structured_search.py"
      - "tests/test_akron_money_parser_delta.py"
      - "src/proofline/structured.py"
      - "src/proofline/onbase_attachments.py"
      - "src/proofline/progressive.py"
      - "src/proofline/ocr.py"
      - "src/proofline/review.py"
      - "src/proofline/watch_storage.py"
      - "src/proofline/storage.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest

      - name: Ensure bounded OCR capability is present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version | head -1

      - name: Rebuild the exact bounded production evidence state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p akron-money-parser-integrity
          proofline-onbase-attachments \
            --state-dir .akron-money-parser-integrity \
            --manifest-out akron-money-parser-integrity/attachment-manifest.json \
            --relations-out akron-money-parser-integrity/discovered-relations.json \
            --rejections-out akron-money-parser-integrity/rejections.json \
            --sync-limit 8 \
            experiments/akron-2026/onbase-plan.json \
            > akron-money-parser-integrity/sync.json

      - name: Rebuild preferred Silver and structured facts with parser v2
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/profile_attachment_evidence.py \
            --state-dir .akron-money-parser-integrity \
            --output akron-money-parser-integrity/v2-evidence-profile.json \
            --threshold 0.70 \
            --ocr \
            --language eng \
            --dpi 200 \
            > akron-money-parser-integrity/v2-profile-stdout.json

      - name: Measure exact v1 to v2 money parser delta
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/measure_money_parser_delta.py \
            --frozen experiments/akron-2026/r1_t8_money_facts.json \
            --current-profile akron-money-parser-integrity/v2-evidence-profile.json \
            --output akron-money-parser-integrity/parser-delta.json \
            > akron-money-parser-integrity/parser-delta-stdout.json

      - name: Validate parser integrity repair boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('akron-money-parser-integrity')
          sync = json.loads((root / 'sync.json').read_text())
          profile = json.loads((root / 'v2-evidence-profile.json').read_text())
          delta = json.loads((root / 'parser-delta.json').read_text())
          rejections = json.loads((root / 'rejections.json').read_text())

          if rejections:
              raise SystemExit(f'T10 bounded state contains rejected publisher links: {len(rejections)}')

          attachment_sync = sync.get('attachment_sync') or {}
          counts = (attachment_sync.get('watch') or {}).get('counts') or {}
          if attachment_sync.get('resource_count') != 8:
              raise SystemExit(f"T10 bounded source sample changed size: {attachment_sync.get('resource_count')}")
          if counts.get('new') != 8 or counts.get('unavailable') != 0:
              raise SystemExit(f'T10 fresh bounded attachment sync failed: {counts}')

          build = profile['post_ocr']['structured_build']
          if build.get('parser_version') != 'proofline-structured/v2':
              raise SystemExit(f"T10 did not run structured parser v2: {build.get('parser_version')}")
          if profile['ocr']['failed'] != 0:
              raise SystemExit(f"T10 OCR produced failures: {profile['ocr']['failures']}")
          if len(profile['post_ocr']['facts']['money']) != 31:
              raise SystemExit('T10 v2 money fact population no longer contains exactly 31 anchored facts')

          if delta.get('schema') != 'proofline-akron-money-parser-delta/v1':
              raise SystemExit('unexpected T10 parser delta schema')
          if not delta.get('exact_source_artifact_match'):
              raise SystemExit('T10 source/Bronze identity comparison failed')
          if delta.get('old_parser_version') != 'proofline-structured/v1':
              raise SystemExit('T10 old parser boundary changed')
          if delta.get('new_parser_version') != 'proofline-structured/v2':
              raise SystemExit('T10 new parser boundary changed')
          if delta.get('fact_count') != 31:
              raise SystemExit(f"T10 v2 fact count changed: {delta.get('fact_count')}")
          if delta.get('unchanged_fact_count') != 29:
              raise SystemExit(f"T10 expected 29 unchanged facts: {delta.get('unchanged_fact_count')}")
          if delta.get('changed_fact_count') != 2:
              raise SystemExit(f"T10 expected exactly two corrected facts: {delta.get('changed_fact_count')}")
          if delta.get('unexpected_changes'):
              raise SystemExit(f"T10 contains unexpected parser changes: {delta['unexpected_changes']}")
          if delta.get('missing_expected_changes'):
              raise SystemExit(f"T10 failed to perform expected parser repairs: {delta['missing_expected_changes']}")

          changes = {
              (item['source'], item['locator'], item['char_start']): item
              for item in delta['changes']
          }
          magnitude = changes.get(('s4', 'page:4', 378))
          spaced = changes.get(('s5', 'page:2', 1207))
          if magnitude is None or magnitude['new'] != {
              'raw_text': '$138MM',
              'normalized_text': '138000000.00',
              'char_end': 384,
          }:
              raise SystemExit(f'T10 magnitude repair differs from measured expectation: {magnitude}')
          if spaced is None or spaced['new'] != {
              'raw_text': '$ 51 ,780.00',
              'normalized_text': '51780.00',
              'char_end': 1219,
          }:
              raise SystemExit(f'T10 spaced-thousands repair differs from measured expectation: {spaced}')

          summary = {
              'parser_version': build['parser_version'],
              'money_fact_count': delta['fact_count'],
              'unchanged_fact_count': delta['unchanged_fact_count'],
              'changed_fact_count': delta['changed_fact_count'],
              'corrected_spaced_thousands': spaced['new'],
              'corrected_magnitude_suffix': magnitude['new'],
              'unexpected_change_count': len(delta['unexpected_changes']),
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload T10 parser integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-money-parser-integrity
          path: akron-money-parser-integrity/
          if-no-files-found: error
          retention-days: 14
