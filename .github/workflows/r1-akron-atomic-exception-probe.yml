name: r1-akron-atomic-exception-probe

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-atomic-exception-probe.yml"
      - "experiments/akron-2026/probe_atomic_exceptions.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch only publisher-linked atomicity exceptions
        run: |
          python experiments/akron-2026/probe_atomic_exceptions.py atomic-exception-results \
            > atomic-exception-results.json
          test -s atomic-exception-results/exceptions.json

      - name: Upload exception evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-atomic-exceptions
          path: |
            atomic-exception-results/
            atomic-exception-results.json
          if-no-files-found: error
          retention-days: 14
