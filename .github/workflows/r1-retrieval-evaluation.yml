name: r1-retrieval-evaluation

on:
  pull_request:
    paths:
      - ".github/workflows/r1-retrieval-evaluation.yml"
      - "src/proofline/evaluation.py"
      - "src/proofline/search.py"
      - "src/proofline/structured.py"
      - "experiments/canton-2026/retrieval/r1-benchmark-unscored.json"
      - "experiments/canton-2026/retrieval/R1_FREEZE.md"
      - "experiments/canton-2026/source-plan.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest

      - name: Verify frozen suite identity before scoring
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path('experiments/canton-2026/retrieval/r1-benchmark-unscored.json')
          expected = '867d6c47f3ae542c40cfa5748a0473c9dffd9af8bf5db6fa3af711690fe2da82'
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f'frozen benchmark sha256: {actual}')
          if actual != expected:
              raise SystemExit(f'frozen benchmark changed before scoring: expected {expected}, got {actual}')
          PY

      - name: Rebuild Canton evidence and indexes
        shell: bash
        run: |
          set -o pipefail
          mkdir -p r1-evaluation-results
          proofline --state-dir .r1eval sync experiments/canton-2026/source-plan.json \
            > r1-evaluation-results/sync.json

      - name: Score the frozen benchmark exactly as written
        run: |
          proofline --state-dir .r1eval evaluate \
            experiments/canton-2026/retrieval/r1-benchmark-unscored.json \
            --k 10 > r1-evaluation-results/evaluation.json

      - name: Summarize measurements without imposing a success threshold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('r1-evaluation-results/evaluation.json').read_text())
          summary = {
              'schema': result.get('schema'),
              'suite': result.get('suite'),
              'cases': result.get('cases'),
              'k': result.get('k'),
              'expectation_accuracy': result.get('expectation_accuracy'),
              'hit_rate_at_k': result.get('hit_rate_at_k'),
              'target_recall_at_k': result.get('target_recall_at_k'),
              'negative_case_count': result.get('negative_case_count'),
              'negative_accuracy': result.get('negative_accuracy'),
              'provenance_validity': result.get('provenance_validity'),
              'unresolved_target_count': result.get('unresolved_target_count'),
              'failure_counts': result.get('failure_counts'),
              'mode_metrics': result.get('mode_metrics'),
          }
          Path('r1-evaluation-results/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          if result.get('schema') != 'proofline-retrieval-eval/v2':
              raise SystemExit('evaluation did not use v2 contract')
          if result.get('cases') != 33:
              raise SystemExit(f"frozen suite case count changed: {result.get('cases')}")
          # Do not fail on hit rate, recall, expectation accuracy, or unresolved targets.
          # Those are the measurements this workflow exists to capture.
          PY

      - name: Verify frozen suite identity after scoring
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('experiments/canton-2026/retrieval/r1-benchmark-unscored.json')
          expected = '867d6c47f3ae542c40cfa5748a0473c9dffd9af8bf5db6fa3af711690fe2da82'
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('evaluation mutated the frozen benchmark')
          PY

      - name: Upload complete R1 retrieval measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-retrieval-evaluation
          path: r1-evaluation-results/
          if-no-files-found: error
          retention-days: 14
