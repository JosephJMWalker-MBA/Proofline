name: t15-compat-patch

on:
  push:
    branches:
      - agent/r1-money-parser-v3-integrity
    paths:
      - ".github/workflows/t15-compat-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r1-money-parser-v3-integrity
          fetch-depth: 0
      - name: Pin historical parser contracts explicitly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/akron-2026/profile_attachment_evidence.py)" = "c68aec3dfe890da7e962181073abb63290b85e5f"
          test "$(git hash-object experiments/akron-2026/evaluate_money_roles.py)" = "c706a3f94343e49429ac3710cb6f87c544a1c4f5"
          test "$(git hash-object experiments/akron-2026/evaluate_financial_representation_v2_oos.py)" = "459fdfdb6ce39a12a82a672a6d0c47dee3026a1e"
          test "$(git hash-object .github/workflows/r1-akron-money-parser-integrity.yml)" = "49c9d61491ed0e23cc345f5564fabce0ff9c41ab"
          test "$(git hash-object .github/workflows/r1-akron-money-context-profile.yml)" = "3eac4e0228a097dc881c7458ea4335fdf00e9ad2"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path_str}: expected exact replacement once, found {text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          profile = Path("experiments/akron-2026/profile_attachment_evidence.py")
          text = profile.read_text(encoding="utf-8")
          old = "    dpi: int,\n) -> dict:\n"
          if text.count(old) != 1:
              raise SystemExit("profile signature did not match once")
          text = text.replace(old, "    dpi: int,\n    parser_version: str | None = None,\n) -> dict:\n")
          if text.count("    native_build = structured.rebuild()\n") != 1:
              raise SystemExit("native structured rebuild did not match once")
          if text.count("    post_build = structured.rebuild()\n") != 1:
              raise SystemExit("post-OCR structured rebuild did not match once")
          text = text.replace("    native_build = structured.rebuild()\n", "    native_build = structured.rebuild(parser_version=parser_version)\n")
          text = text.replace("    post_build = structured.rebuild()\n", "    post_build = structured.rebuild(parser_version=parser_version)\n")
          old = '    parser.add_argument("--dpi", type=int, default=200)\n'
          if text.count(old) != 1:
              raise SystemExit("profile CLI dpi argument did not match once")
          text = text.replace(old, old + '    parser.add_argument("--parser-version")\n')
          old = "        dpi=args.dpi,\n    )\n"
          if text.count(old) != 1:
              raise SystemExit("profile build call did not match once")
          text = text.replace(old, "        dpi=args.dpi,\n        parser_version=args.parser_version,\n    )\n")
          profile.write_text(text, encoding="utf-8")

          replace_once(
              "experiments/akron-2026/evaluate_money_roles.py",
              "    build = structured.rebuild()\n",
              '    build = structured.rebuild(parser_version=contract["parser_version"])\n',
          )
          replace_once(
              "experiments/akron-2026/evaluate_financial_representation_v2_oos.py",
              "    build = structured.rebuild()\n",
              '    build = structured.rebuild(parser_version=contract["parser_version"])\n',
          )

          for workflow in (
              ".github/workflows/r1-akron-money-parser-integrity.yml",
              ".github/workflows/r1-akron-money-context-profile.yml",
          ):
              replace_once(
                  workflow,
                  "            --threshold 0.70 \\\n",
                  "            --parser-version proofline-structured/v2 \\\n            --threshold 0.70 \\\n",
              )
          PY
          python -m py_compile \
            experiments/akron-2026/profile_attachment_evidence.py \
            experiments/akron-2026/evaluate_money_roles.py \
            experiments/akron-2026/evaluate_financial_representation_v2_oos.py
          rm .github/workflows/t15-compat-patch.yml
          git config user.name "Joseph Walker"
          git config user.email "joseph@decisionpointinitiative.com"
          git add -- \
            experiments/akron-2026/profile_attachment_evidence.py \
            experiments/akron-2026/evaluate_money_roles.py \
            experiments/akron-2026/evaluate_financial_representation_v2_oos.py \
            .github/workflows/r1-akron-money-parser-integrity.yml \
            .github/workflows/r1-akron-money-context-profile.yml \
            .github/workflows/t15-compat-patch.yml
          git commit -m "R1.T15: pin historical parser contracts"
          git push origin HEAD:agent/r1-money-parser-v3-integrity
