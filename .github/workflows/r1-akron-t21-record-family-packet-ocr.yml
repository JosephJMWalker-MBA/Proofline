name: r1-akron-t21-record-family-packet-ocr

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-t21-record-family-packet-ocr.yml"
      - "experiments/akron-2026/recover_t21_record_family_packet_ocr.py"
      - "experiments/akron-2026/r1_t21_record_family_evolution_summary.json"
      - "experiments/akron-2026/r1_t21_record_family_packet_selection.json"
      - "experiments/akron-2026/measure_t21_record_family_evolution.py"
      - "src/proofline/ocr.py"
      - "src/proofline/progressive.py"
      - "src/proofline/review.py"
      - "src/proofline/onbase_attachments.py"
      - "tests/test_t21_record_family_packet_ocr.py"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify frozen T21 receipt, selection, and OCR machinery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/akron-2026/r1_t21_record_family_evolution_summary.json)" = "da1c9c2431c5f423b0c0b72d6e9801638d45797f"
          test "$(git hash-object experiments/akron-2026/r1_t21_record_family_packet_selection.json)" = "a6db311cf19b3fcb1f6856142df03866b91b0923"
          test "$(git hash-object experiments/akron-2026/measure_t21_record_family_evolution.py)" = "da7335a4072a145c5b2e61e49de04a7faf15081a"
          test "$(git hash-object experiments/akron-2026/recover_t21_record_family_packet_ocr.py)" = "41daa4a5dbe167e88f8a33a4990c685bff5ecf0d"
          test "$(git hash-object src/proofline/ocr.py)" = "8337c251aa8facd3074242c6c375136146c1e2e3"
          test "$(git hash-object src/proofline/progressive.py)" = "4c65f7840271fffd3fa8afa7b8d45a40ad2481d5"
          test "$(git hash-object src/proofline/review.py)" = "4bd49ce877178d294167074cbb1aa31e6ed49e4b"
          test "$(git hash-object src/proofline/onbase_attachments.py)" = "629421673d8d7a47ab0580c6e0f08cbc2d62ea26"
          test "$(git hash-object src/proofline/onbase_attachments_cli.py)" = "eb3ec92694a877a6b4365db04271974392e9a402"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite and OCR helper smoke gate
        shell: bash
        run: |
          set -euo pipefail
          pytest
          python experiments/akron-2026/recover_t21_record_family_packet_ocr.py --help >/dev/null

      - name: Ensure bounded OCR capability is present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version | head -1

      - name: Rebuild canonical Akron parents and attachment relation graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .akron-t21-packet-ocr akron-t21-packet-ocr
          mkdir -p akron-t21-packet-ocr
          proofline-onbase-attachments \
            --state-dir .akron-t21-packet-ocr \
            --manifest-out akron-t21-packet-ocr/attachment-manifest.json \
            --relations-out akron-t21-packet-ocr/discovered-relations.json \
            --rejections-out akron-t21-packet-ocr/rejections.json \
            experiments/akron-2026/onbase-plan.json \
            > akron-t21-packet-ocr/discovery.json
          test "$(sha256sum akron-t21-packet-ocr/attachment-manifest.json | awk '{print $1}')" = "7f3ad866a54c15c423589439826f45210a9be11a515e1886cf9e930ecda3e82a"
          test "$(python - <<'PY'
          import json
          print(len(json.load(open('akron-t21-packet-ocr/rejections.json'))))
          PY
          )" = "0"

      - name: Prove frozen lineage and deterministic representative before packet acquisition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          path = Path('experiments/akron-2026/recover_t21_record_family_packet_ocr.py')
          spec = importlib.util.spec_from_file_location('t21_packet_ocr', path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          selection = json.load(open('experiments/akron-2026/r1_t21_record_family_packet_selection.json'))
          receipt = json.load(open('experiments/akron-2026/r1_t21_record_family_evolution_summary.json'))
          relations = json.load(open('akron-t21-packet-ocr/discovered-relations.json'))
          manifest = json.load(open('akron-t21-packet-ocr/attachment-manifest.json'))

          module.verify_receipt(receipt, selection)
          representative, relation = module.representative_manifest(selection, relations, manifest)
          assert len(representative.resources) == 1
          assert relation['meeting_id'] == 668
          assert relation['item_id'] == 46485
          assert relation['publish_id'] == 100240
          PY

      - name: Reacquire frozen Bronze once and recover raw Silver OCR
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/recover_t21_record_family_packet_ocr.py \
            --state-dir .akron-t21-packet-ocr \
            --selection experiments/akron-2026/r1_t21_record_family_packet_selection.json \
            --receipt experiments/akron-2026/r1_t21_record_family_evolution_summary.json \
            --relations akron-t21-packet-ocr/discovered-relations.json \
            --attachment-manifest akron-t21-packet-ocr/attachment-manifest.json \
            --threshold 0.70 \
            --language eng \
            --dpi 200 \
            --output akron-t21-packet-ocr/packet-ocr.json \
            > akron-t21-packet-ocr/packet-ocr-stdout.json
          cat akron-t21-packet-ocr/packet-ocr-stdout.json

      - name: Validate raw Silver accounting and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p = json.load(open('akron-t21-packet-ocr/packet-ocr.json'))
          assert p['schema'] == 'proofline-akron-t21-record-family-packet-ocr/v1'
          assert p['stage'] == 'raw_packet_ocr_silver_before_contextual_interpretation'
          assert p['bronze']['artifact_id'] == 'artifact:87e0ab7f1a3bb6f3b0e5a37dc311cfb909cf081d1bfe28297421c294bc00386a'
          assert p['bronze']['sha256'] == '87e0ab7f1a3bb6f3b0e5a37dc311cfb909cf081d1bfe28297421c294bc00386a'
          assert p['bronze']['page_count'] == 3
          assert p['silver']['page_count'] == 3
          o = p['ocr']
          assert o['candidates'] == 3
          assert o['attempted'] + o['skipped'] == o['candidates']
          assert 0 <= o['added'] <= o['attempted']
          assert 0 <= o['failed'] <= o['attempted']
          assert 0 <= p['silver']['preferred_ocr_page_count'] <= 3
          assert 0 <= p['silver']['nonblank_page_count'] <= 3
          assert 0 <= p['silver']['quality_floor_page_count'] <= 3
          reuse = p['lineage_reuse']
          assert reuse['publisher_source_identity_count'] == 24
          assert reuse['unique_bronze_artifact_count'] == 1
          assert reuse['silver_extracted_once_for_content_addressed_artifact'] is True
          assert reuse['source_relation_created'] is False
          assert reuse['source_family_modified'] is False
          assert p['authority_boundary'] == {
              'packet_content_interpreted': False,
              'event_identity_assigned': False,
              'meeting_occurrence_asserted': False,
              'outcome_assigned': False,
              'detector_authorized': False,
              'lead_count': None,
          }
          PY

      - name: Upload raw pre-interpretation T21 packet OCR evidence
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-t21-record-family-packet-ocr
          path: |
            akron-t21-packet-ocr/packet-ocr.json
            akron-t21-packet-ocr/packet-ocr-stdout.json
            akron-t21-packet-ocr/discovery.json
            akron-t21-packet-ocr/attachment-manifest.json
            akron-t21-packet-ocr/discovered-relations.json
            akron-t21-packet-ocr/rejections.json
            experiments/akron-2026/r1_t21_record_family_evolution_summary.json
            experiments/akron-2026/r1_t21_record_family_packet_selection.json
          if-no-files-found: error
          retention-days: 14
