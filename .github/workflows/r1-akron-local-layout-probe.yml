name: r1-akron-local-layout-probe

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-local-layout-probe.yml"
      - "experiments/akron-2026/profile_local_layout.py"
      - "experiments/akron-2026/profile_spatial_text.py"
      - "experiments/akron-2026/r1_t13b_disjoint_attachment_sources.json"
      - "experiments/akron-2026/r1_t13b_source_artifact_map.json"
      - "experiments/akron-2026/r1_t14_known_amount_type_audit.json"
      - "experiments/akron-2026/r1_t16_native_structure_summary.json"
      - "experiments/akron-2026/r1_t17_spatial_text_summary.json"
      - "experiments/akron-2026/sync_frozen_attachment_holdout.py"
      - "experiments/akron-2026/onbase-plan.json"
      - "src/proofline/local_layout.py"
      - "src/proofline/spatial_text.py"
      - "src/proofline/structured.py"
      - "tests/test_local_layout.py"
      - "tests/test_spatial_text.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest

      - name: Ensure bounded OCR capability is present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version | head -1

      - name: Rebuild canonical Akron parents and full attachment identity graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .akron-local-layout akron-local-layout
          mkdir -p akron-local-layout
          proofline-onbase-attachments \
            --state-dir .akron-local-layout \
            --manifest-out akron-local-layout/attachment-manifest.json \
            --relations-out akron-local-layout/discovered-relations.json \
            --rejections-out akron-local-layout/rejections.json \
            experiments/akron-2026/onbase-plan.json \
            > akron-local-layout/discovery.json
          test "$(sha256sum akron-local-layout/attachment-manifest.json | awk '{print $1}')" = "7f3ad866a54c15c423589439826f45210a9be11a515e1886cf9e930ecda3e82a"

      - name: Sync exact already-opened T13b ranks 33-64 source set
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/sync_frozen_attachment_holdout.py \
            --state-dir .akron-local-layout \
            --manifest akron-local-layout/attachment-manifest.json \
            --relations akron-local-layout/discovered-relations.json \
            --selection experiments/akron-2026/r1_t13b_disjoint_attachment_sources.json \
            --output akron-local-layout/selection-sync.json \
            > akron-local-layout/selection-sync-stdout.json

      - name: Regenerate exact T17 spatial profile
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/profile_spatial_text.py \
            --state-dir .akron-local-layout \
            --selection-sync akron-local-layout/selection-sync.json \
            --audit experiments/akron-2026/r1_t14_known_amount_type_audit.json \
            --t16-summary experiments/akron-2026/r1_t16_native_structure_summary.json \
            --source-artifact-map experiments/akron-2026/r1_t13b_source_artifact_map.json \
            --language eng \
            --dpi 200 \
            --output akron-local-layout/spatial-text-profile.json \
            > akron-local-layout/spatial-text-profile-stdout.json

      - name: Profile bounded local-layout relationships
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/profile_local_layout.py \
            --spatial-profile akron-local-layout/spatial-text-profile.json \
            --t17-summary experiments/akron-2026/r1_t17_spatial_text_summary.json \
            --output akron-local-layout/local-layout-profile.json \
            > akron-local-layout/local-layout-profile-stdout.json

      - name: Validate provenance and non-semantic boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('akron-local-layout')
          profile = json.loads((root / 'local-layout-profile.json').read_text())
          rejections = json.loads((root / 'rejections.json').read_text())

          if profile.get('schema') != 'proofline-akron-t18-local-layout-profile/v1':
              raise SystemExit('unexpected T18 local-layout profile schema')
          if profile.get('stage') != 'post_hoc_bounded_local_layout_capability_probe_on_opened_t13b_t14':
              raise SystemExit('T18 stage boundary changed')
          if rejections:
              raise SystemExit(f'T18 source graph contains rejected publisher links: {len(rejections)}')

          sample = profile['sample']
          if sample['source_identity_count'] != 32 or sample['unique_artifact_count'] != 28:
              raise SystemExit(f'T18 frozen population changed: {sample}')
          if sample['selection_signature_sha256'] != 'b0986198c10856b8235c87361dc54999f93c5bcb59514ca8ff26cf957db2b966':
              raise SystemExit('T18 source selection signature changed')
          if sample['source_artifact_mapping_signature_sha256'] != '797f8986110664bf23019536a3c9721c7e283cd81b730e3eb867459b34848edf':
              raise SystemExit('T18 Bronze map signature changed')
          if sample['exact_source_to_bronze_match_count'] != 32 or sample['bronze_byte_identity_drift_count'] != 0:
              raise SystemExit(f'T18 exact Bronze continuity failed: {sample}')
          if sample['status'] != 'already_opened_t13b_t14_development_data_not_new_holdout':
              raise SystemExit('T18 incorrectly claims a new holdout')

          contract = profile['local_layout_contract']
          if contract['method'] != 'proofline-local-layout/v1':
              raise SystemExit('T18 local-layout method changed')
          if contract['input_spatial_page_count'] != 7:
              raise SystemExit('T18 did not consume exactly seven frozen T17 pages')
          for key in (
              'canonical_silver_changed', 'sqlite_storage_changed', 'search_changed',
              'structured_index_changed', 'table_semantics_assigned', 'field_semantics_assigned',
              'financial_semantics_changed', 'event_identity_assigned', 'detector_authorized',
          ):
              if contract.get(key) is not False:
                  raise SystemExit(f'T18 boundary changed: {key}={contract.get(key)!r}')
          if contract.get('lead_count') is not None:
              raise SystemExit('T18 emitted leads')

          audit = profile['post_hoc_t14_characterization']
          if audit['fee_schedule_group_count'] != 6 or len(audit['fee_schedule_groups']) != 6:
              raise SystemExit('T18 no longer measures all six frozen fee groups')
          comparable = audit['fee_nearest_peer_comparable_count']
          same = audit['fee_nearest_peer_same_audit_class_count']
          rate = audit['fee_nearest_peer_same_audit_class_rate']
          if not isinstance(comparable, int) or comparable < 0:
              raise SystemExit('T18 invalid comparable fee count')
          if not isinstance(same, int) or not 0 <= same <= comparable:
              raise SystemExit('T18 invalid same-class fee count')
          if comparable:
              if not isinstance(rate, (int, float)) or not 0 <= rate <= 1:
                  raise SystemExit('T18 invalid nearest-peer same-class rate')
          elif rate is not None:
              raise SystemExit('T18 emitted a rate without comparable targets')

          relation_count = 0
          for group in audit['fee_schedule_groups']:
              for artifact in group['artifact_results']:
                  if artifact['target_region_count'] < 1:
                      raise SystemExit('T18 fee artifact lost all frozen target regions')
                  for target in artifact['target_regions']:
                      if not str(target['region']['region_id']).startswith('layout-region:'):
                          raise SystemExit('T18 target region lost deterministic identity')
                      nearest = target['nearest_target_peer']
                      if nearest is not None:
                          relation = nearest['relation']
                          if not str(relation['relation_id']).startswith('layout-relation:'):
                              raise SystemExit('T18 nearest-peer relation lost deterministic identity')
                          if relation['spatial_id'] != artifact['spatial_id']:
                              raise SystemExit('T18 nearest-peer relation lost spatial lineage')
                          relation_count += 1
          if relation_count < 1:
              raise SystemExit('T18 emitted no fee local-layout relations')

          assessment = audit['assessment']
          candidate_count = assessment['money_candidate_region_count']
          rank = assessment['target_money_distance_rank']
          if not isinstance(candidate_count, int) or candidate_count < 1:
              raise SystemExit('T18 assessment emitted no money candidates')
          if not isinstance(rank, int) or not 1 <= rank <= candidate_count:
              raise SystemExit('T18 invalid assessment target distance rank')
          if not isinstance(assessment['target_is_nearest_money_region'], bool):
              raise SystemExit('T18 invalid assessment nearest-money result')
          relation = assessment['target_relation']
          if not str(relation['relation_id']).startswith('layout-relation:'):
              raise SystemExit('T18 assessment relation lost deterministic identity')
          if relation['spatial_id'] != assessment['spatial_id']:
              raise SystemExit('T18 assessment relation lost spatial lineage')
          if relation['same_extractor_line'] is not False:
              raise SystemExit('T18 no longer preserves the frozen cross-line assessment counterexample')

          decision = profile['stage_decision']
          if decision.get('detector_authorized') is not False:
              raise SystemExit('T18 authorized a detector')
          if decision.get('financial_semantics_authorized') is not False:
              raise SystemExit('T18 authorized financial semantics')
          if decision.get('event_identity_assigned') is not False:
              raise SystemExit('T18 assigned event identity')
          if decision.get('lead_count') is not None:
              raise SystemExit('T18 emitted leads')
          if decision.get('next_boundary') is not None:
              raise SystemExit('T18 chose T19 before the measured result was reviewed')

          summary = {
              'source_identity_count': sample['source_identity_count'],
              'unique_artifact_count': sample['unique_artifact_count'],
              'exact_source_to_bronze_match_count': sample['exact_source_to_bronze_match_count'],
              'bronze_byte_identity_drift_count': sample['bronze_byte_identity_drift_count'],
              'fee_target_region_count': audit['fee_target_region_count'],
              'fee_nearest_peer_comparable_count': comparable,
              'fee_nearest_peer_same_audit_class_count': same,
              'fee_nearest_peer_same_audit_class_rate': rate,
              'assessment_money_candidate_region_count': candidate_count,
              'assessment_target_money_distance_rank': rank,
              'assessment_target_is_nearest_money_region': assessment['target_is_nearest_money_region'],
              'assessment_target_relation_normalized_distance': relation['normalized_center_distance_page_diagonal'],
              'assessment_target_relation_direction': relation['dominant_direction'],
              'assessment_target_relation_same_extractor_line': relation['same_extractor_line'],
              'detector_authorized': decision['detector_authorized'],
              'lead_count': decision['lead_count'],
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload T18 local-layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-local-layout-probe
          path: akron-local-layout/
          if-no-files-found: error
          retention-days: 14
