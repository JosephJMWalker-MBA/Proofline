name: r1-akron-retrieval-evaluation

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-retrieval-evaluation.yml"
      - "src/proofline/evaluation.py"
      - "src/proofline/evaluation_reporting.py"
      - "src/proofline/search.py"
      - "src/proofline/structured.py"
      - "src/proofline/onbase.py"
      - "src/proofline/onbase_cli.py"
      - "experiments/akron-2026/onbase-plan.json"
      - "experiments/akron-2026/source-policy.json"
      - "experiments/akron-2026/retrieval/r1-transfer-v1-unscored.json.gz"
      - "experiments/akron-2026/retrieval/R1_TRANSFER_V1_FREEZE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest

      - name: Verify and materialize exact frozen Akron suite before scoring
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          from pathlib import Path

          frozen = Path('experiments/akron-2026/retrieval/r1-transfer-v1-unscored.json.gz')
          expected_gzip = '2beb620c3421389575175349e28f16dd4ef75364fcf675efe7933d298c49da78'
          expected_json = 'fc9829b5f2221b7bd5d8eca992700d05e784e1c2f3a08760d862b1ef65ecb681'

          compressed = frozen.read_bytes()
          actual_gzip = hashlib.sha256(compressed).hexdigest()
          print(f'frozen Akron gzip sha256: {actual_gzip}')
          if actual_gzip != expected_gzip:
              raise SystemExit(
                  f'frozen Akron gzip changed: expected {expected_gzip}, got {actual_gzip}'
              )

          benchmark = gzip.decompress(compressed)
          actual_json = hashlib.sha256(benchmark).hexdigest()
          print(f'frozen Akron benchmark sha256: {actual_json}')
          if actual_json != expected_json:
              raise SystemExit(
                  f'frozen Akron benchmark changed: expected {expected_json}, got {actual_json}'
              )

          Path('r1-akron-evaluation').mkdir(exist_ok=True)
          Path('r1-akron-evaluation/frozen-benchmark.json').write_bytes(benchmark)
          PY

      - name: Rebuild live Akron evidence
        shell: bash
        run: |
          set -o pipefail
          proofline-onbase \
            --state-dir .r1akroneval \
            --manifest-out r1-akron-evaluation/agenda-items.json \
            experiments/akron-2026/onbase-plan.json \
            > r1-akron-evaluation/sync.json

      - name: Build ordinary Proofline indexes over current Akron evidence
        shell: bash
        run: |
          set -o pipefail
          proofline --state-dir .r1akroneval index \
            > r1-akron-evaluation/index.json
          proofline --state-dir .r1akroneval status \
            > r1-akron-evaluation/status.json

      - name: Score exact frozen Akron benchmark
        run: |
          proofline --state-dir .r1akroneval evaluate \
            r1-akron-evaluation/frozen-benchmark.json \
            --k 10 > r1-akron-evaluation/evaluation.json

      - name: Derive scorable metrics separately from raw evaluator output
        run: |
          python -m proofline.evaluation_report_cli \
            r1-akron-evaluation/evaluation.json \
            --output r1-akron-evaluation/scorable-report.json

      - name: Summarize measurements without imposing retrieval thresholds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path('r1-akron-evaluation/evaluation.json').read_text())
          scorable = json.loads(Path('r1-akron-evaluation/scorable-report.json').read_text())
          sync = json.loads(Path('r1-akron-evaluation/sync.json').read_text())
          manifest = json.loads(Path('r1-akron-evaluation/agenda-items.json').read_text())

          summary = {
              'benchmark': {
                  'frozen_case_count': 37,
                  'frozen_positive_target_count': 54,
                  'decompressed_sha256': 'fc9829b5f2221b7bd5d8eca992700d05e784e1c2f3a08760d862b1ef65ecb681',
                  'retrieval_consulted_before_freeze': False,
              },
              'live_source': {
                  'meeting_count': sync.get('onbase', {}).get('meeting_count'),
                  'agenda_item_count': sync.get('onbase', {}).get('agenda_item_count'),
                  'manifest_resource_count': len(manifest.get('resources') or []),
                  'canonical_sync_counts': sync.get('canonical_sync', {}).get('counts'),
                  'manifest_sha256': sync.get('manifest_sha256'),
              },
              'raw': {
                  'schema': raw.get('schema'),
                  'cases': raw.get('cases'),
                  'expectation_accuracy': raw.get('expectation_accuracy'),
                  'hit_rate_at_k': raw.get('hit_rate_at_k'),
                  'target_recall_at_k': raw.get('target_recall_at_k'),
                  'negative_accuracy': raw.get('negative_accuracy'),
                  'provenance_validity': raw.get('provenance_validity'),
                  'unresolved_target_count': raw.get('unresolved_target_count'),
                  'failure_counts': raw.get('failure_counts'),
              },
              'scorable': scorable,
          }
          Path('r1-akron-evaluation/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          if raw.get('schema') != 'proofline-retrieval-eval/v2':
              raise SystemExit('Akron evaluation did not use v2 contract')
          if raw.get('cases') != 37:
              raise SystemExit(f"frozen Akron case count changed: {raw.get('cases')}")
          if scorable.get('cases') != 37:
              raise SystemExit('scorable report case count does not match frozen Akron suite')
          # Deliberately do not fail on hit rate, recall, unresolved targets, or retrieval failures.
          # Publisher drift and retrieval misses are measurements once the suite is frozen.
          PY

      - name: Verify frozen suite remained unchanged after scoring
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          from pathlib import Path

          frozen = Path('experiments/akron-2026/retrieval/r1-transfer-v1-unscored.json.gz')
          if hashlib.sha256(frozen.read_bytes()).hexdigest() != '2beb620c3421389575175349e28f16dd4ef75364fcf675efe7933d298c49da78':
              raise SystemExit('Akron evaluation mutated the frozen gzip fixture')
          if hashlib.sha256(gzip.decompress(frozen.read_bytes())).hexdigest() != 'fc9829b5f2221b7bd5d8eca992700d05e784e1c2f3a08760d862b1ef65ecb681':
              raise SystemExit('Akron evaluation mutated the frozen benchmark bytes')
          PY

      - name: Upload complete Akron transfer measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-retrieval-evaluation
          path: r1-akron-evaluation/
          if-no-files-found: error
          retention-days: 14
