name: r1-akron-t21-council-minutes-date-search

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-t21-council-minutes-date-search.yml"
      - "experiments/akron-2026/measure_t21_council_minutes_date_search.py"
      - "experiments/akron-2026/r1_t21_council_minutes_date_search_plan.json"
      - "experiments/akron-2026/r1_t21_council_minutes_date_search_summary.json"
      - "experiments/akron-2026/r1_t21_council_minutes_source_contract_summary.json"
      - "experiments/akron-2026/r1_t21_terminal_record_target.json"
      - "experiments/akron-2026/r1_t21_agenda_status_sequence_summary.json"
      - "tests/test_t21_council_minutes_date_search_measurement.py"
      - "tests/test_t21_council_minutes_date_search_receipt.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  council-minutes-date-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Verify frozen plan and run full test suite
        shell: bash
        run: |
          set -euo pipefail
          pytest
          python -m py_compile experiments/akron-2026/measure_t21_council_minutes_date_search.py

      - name: Run year control and 22 frozen Council minutes date searches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf akron-council-minutes-date-search
          python experiments/akron-2026/measure_t21_council_minutes_date_search.py \
            akron-council-minutes-date-search \
            | tee akron-council-minutes-date-search-stdout.json
          test -s akron-council-minutes-date-search/council-minutes-date-search-measurement.json
          test -s akron-council-minutes-date-search/year_2026_control.json

      - name: Validate candidate-only authority and complete responses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from urllib.parse import urlparse

          p = json.load(open('akron-council-minutes-date-search/council-minutes-date-search-measurement.json'))
          assert p['schema'] == 'proofline-akron-t21-council-minutes-date-search-measurement/v1'
          assert p['stage'] == 'publisher_council_minutes_exact_date_candidate_search_only'
          assert p['source_contract']['query_id'] == '175'
          assert p['source_contract']['meeting_date_keyword_id'] == '124'
          assert p['source_contract']['year_keyword_id'] == '532'
          assert p['source_contract']['query_limit'] == 0
          assert urlparse(p['endpoint']).hostname == 'onlinedocs.akronohio.gov'

          control = p['positive_control']
          assert control['response']['ok'] is True
          assert control['response']['same_host'] is True
          assert control['truncated'] is False
          assert control['returned_document_count'] >= 1
          assert control['request_payload'] == {
              'QueryID': 175,
              'Keywords': [{
                  'ID': 532,
                  'Name': 'Year',
                  'Value': '2026',
                  'KeywordOperator': '=',
              }],
              'QueryLimit': 0,
          }

          assert len(p['eastwood_searches']) == 22
          assert p['counts']['eastwood_request_count'] == 22
          assert p['counts']['successful_eastwood_request_count'] == 22
          assert p['counts']['truncated_eastwood_request_count'] == 0
          for row in p['eastwood_searches']:
              assert row['response']['ok'] is True
              assert row['response']['same_host'] is True
              assert row['truncated'] is False
              assert row['request_payload']['QueryID'] == 175
              assert row['request_payload']['QueryLimit'] == 0
              assert row['request_payload']['Keywords'][0]['ID'] == 124
              assert row['request_payload']['Keywords'][0]['Name'] == 'Meeting Date'
              assert row['request_payload']['Keywords'][0]['KeywordOperator'] == '='

          candidates = p['candidate_population']
          assert candidates['raw_retrieval_token_count'] == p['counts']['eastwood_returned_document_token_count']
          assert candidates['stable_group_count'] == p['counts']['eastwood_stable_metadata_group_count']
          assert candidates['duplicate_metadata_group_count'] == p['counts']['eastwood_duplicate_metadata_group_count']
          assert candidates['stable_group_count'] <= candidates['raw_retrieval_token_count']
          for group in candidates['groups']:
              assert group['observed_token_count'] == len(group['observed_document_tokens'])
              assert group['observed_token_count'] == len(group['observed_raw_row_sha256'])

          assert p['outcome']['status'] == 'unknown'
          assert p['authority_boundary'] == {
              'document_search_submitted': True,
              'only_predeclared_dates_used': True,
              'post_result_expansion_performed': False,
              'positive_control_excluded_from_eastwood_population': True,
              'query_id_guessed': False,
              'keyword_id_guessed': False,
              'opaque_document_token_treated_as_stable_identity': False,
              'identical_visible_metadata_assumed_same_document': False,
              'identical_visible_metadata_assumed_distinct_documents': False,
              'returned_document_dereferenced': False,
              'terminal_outcome_assigned': False,
              'absence_treated_as_disposition': False,
              'causality_assigned': False,
              'detector_authorized': False,
              'lead_count': None,
          }
          PY

      - name: Reproduce frozen Council minutes date-search receipt
        if: ${{ hashFiles('experiments/akron-2026/r1_t21_council_minutes_date_search_summary.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          live = json.load(open('akron-council-minutes-date-search/council-minutes-date-search-measurement.json'))
          receipt = json.load(open('experiments/akron-2026/r1_t21_council_minutes_date_search_summary.json'))

          assert receipt['schema'] == 'proofline-akron-t21-council-minutes-date-search-receipt/v1'
          assert live['plan']['sha256'] == receipt['plan_sha256']
          assert live['source_contract'] == receipt['source_contract']
          assert live['counts']['eastwood_request_count'] == 22
          assert live['counts']['successful_eastwood_request_count'] == 22
          assert live['counts']['truncated_eastwood_request_count'] == 0
          assert live['counts']['eastwood_dates_with_results'] == receipt['counts']['eastwood_dates_with_results']
          assert live['counts']['eastwood_dates_without_results'] == receipt['counts']['eastwood_dates_without_results']
          assert live['counts']['eastwood_returned_document_token_count'] == receipt['counts']['eastwood_returned_document_token_count']
          assert live['counts']['eastwood_stable_metadata_group_count'] == receipt['counts']['eastwood_stable_metadata_group_count']
          assert live['counts']['eastwood_duplicate_metadata_group_count'] == receipt['counts']['eastwood_duplicate_metadata_group_count']
          assert live['candidate_population']['stable_signature_sha256'] == receipt['stable_candidate_population_signature_sha256']
          assert live['eastwood_response_population_signature_sha256'] == receipt['eastwood_response_population_signature_sha256']

          live_rows = [
              {
                  'meeting_id': row['meeting_id'],
                  'meeting_date': row['meeting_date'],
                  'request_payload_sha256': row['request_payload_sha256'],
                  'returned_document_count': row['returned_document_count'],
                  'stable_unique_projection_count': row['stable_unique_projection_count'],
                  'stable_result_signature_sha256': row['stable_result_signature_sha256'],
              }
              for row in live['eastwood_searches']
          ]
          assert live_rows == receipt['date_receipts']

          control = live['positive_control']
          assert control['response']['ok'] is True
          assert control['truncated'] is False
          assert control['returned_document_count'] >= 1
          assert control['request_payload_sha256'] == receipt['positive_control']['request_payload_sha256']
          assert receipt['positive_control']['population_not_pinned'] is True

          assert live['authority_boundary'] == receipt['authority_boundary']
          assert live['outcome']['status'] == receipt['outcome']['status'] == 'unknown'
          PY

      - name: Upload Council minutes date-search measurement
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-t21-council-minutes-date-search
          path: |
            akron-council-minutes-date-search/
            akron-council-minutes-date-search-stdout.json
            experiments/akron-2026/r1_t21_council_minutes_date_search_summary.json
          if-no-files-found: warn
          retention-days: 14
