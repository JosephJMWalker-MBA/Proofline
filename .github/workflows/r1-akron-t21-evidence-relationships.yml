name: r1-akron-t21-evidence-relationships

on:
  pull_request:
    paths:
      - "src/proofline/evidence_relationships.py"
      - "experiments/akron-2026/reconcile_t21_evidence_relationships.py"
      - "experiments/akron-2026/r1_t21_evidence_relationship_summary.json"
      - "tests/test_t21_evidence_relationships.py"
      - ".github/workflows/r1-akron-t21-evidence-relationships.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-relationships:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite and syntax gate
        run: |
          set -euo pipefail
          pytest
          python -m py_compile src/proofline/evidence_relationships.py experiments/akron-2026/reconcile_t21_evidence_relationships.py
      - name: Build deterministic evidence relationship graph
        run: |
          set -euo pipefail
          rm -rf akron-evidence-relationships
          python experiments/akron-2026/reconcile_t21_evidence_relationships.py \
            experiments/akron-2026/r1_t21_council_minutes_content_audit_summary.json \
            experiments/akron-2026/r1_t21_committee_minutes_content_audit_summary.json \
            experiments/akron-2026/r1_t21_committee_minutes_date_search_summary.json \
            akron-evidence-relationships
      - name: Validate relationship-only authority boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('akron-evidence-relationships/evidence-relationship-measurement.json'))
          g=p['graph']
          assert g['counts']['evidence_node_count']==8
          assert g['counts']['council_evidence_node_count']==6
          assert g['counts']['committee_evidence_node_count']==2
          assert g['counts']['relationship_count']==6
          assert g['counts']['same_target_same_meeting_count']==3
          assert g['counts']['procedural_phase_corroboration_count']==2
          assert g['counts']['explicit_scheduling_count']==1
          assert g['counts']['unpaired_target_evidence_node_count']==3
          assert g['authority_boundary']['relationships_are_provenance_only'] is True
          assert g['authority_boundary']['same_date_is_not_causality'] is True
          assert g['authority_boundary']['terminal_semantics_authorized'] is False
          assert g['authority_boundary']['causality_assigned'] is False
          assert g['outcome']['status']=='unknown'
          PY
      - name: Reproduce frozen evidence relationship receipt
        if: hashFiles('experiments/akron-2026/r1_t21_evidence_relationship_summary.json') != ''
        run: |
          python - <<'PY'
          import json
          r=json.load(open('experiments/akron-2026/r1_t21_evidence_relationship_summary.json'))
          m=json.load(open('akron-evidence-relationships/evidence-relationship-measurement.json'))
          assert m['source_receipts']==r['source_receipts']
          assert m['graph']['counts']==r['counts']
          assert m['graph']['node_population_signature_sha256']==r['node_population_signature_sha256']
          assert m['graph']['relationship_population_signature_sha256']==r['relationship_population_signature_sha256']
          assert m['graph_signature_sha256']==r['graph_signature_sha256']
          assert m['graph']['nodes']==r['nodes']
          assert m['graph']['relationships']==r['relationships']
          assert m['graph']['unpaired_target_evidence_node_ids']==r['unpaired_target_evidence_node_ids']
          assert m['authority_boundary']==r['authority_boundary']
          assert m['outcome']==r['outcome']
          PY
      - name: Upload evidence relationship graph
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-t21-evidence-relationships
          path: akron-evidence-relationships/
          retention-days: 14
