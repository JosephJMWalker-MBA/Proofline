name: r1-akron-spatial-anchor-t19b-development

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-spatial-anchor-t19b-development.yml"
      - "experiments/akron-2026/evaluate_spatial_anchor_t19b_development.py"
      - "experiments/akron-2026/validate_spatial_anchor_t19b_development.py"
      - "experiments/akron-2026/r1_t19b_spatial_anchor_audit.json"
      - "experiments/akron-2026/r1_t19_future_holdout_sources.json"
      - "experiments/akron-2026/r1_t20_future_holdout_sources.json"
      - "experiments/akron-2026/sync_t19_attachment_holdout.py"
      - "experiments/akron-2026/evaluate_local_grouping_holdout.py"
      - "experiments/akron-2026/onbase-plan.json"
      - "src/proofline/spatial_anchor.py"
      - "src/proofline/spatial_text.py"
      - "src/proofline/local_grouping.py"
      - "src/proofline/local_layout.py"
      - "src/proofline/structured.py"
      - "src/proofline/ocr.py"
      - "src/proofline/progressive.py"
      - "src/proofline/onbase_attachments.py"
      - "tests/test_spatial_anchor.py"
      - "tests/test_t19b_spatial_anchor_audit.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify historical and future-holdout boundaries
        shell: bash
        run: |
          set -euo pipefail
          # The opened T19b sample and frozen grouping method remain historical inputs.
          test "$(git hash-object experiments/akron-2026/r1_t19_future_holdout_sources.json)" = "f604f63fa995a3e80c4204668e14ec02629ac726"
          test "$(git hash-object src/proofline/local_grouping.py)" = "c931c7ea631444f18fa780164deadd126bd47160"
          # T20's untouched ranks 97-128 identity-only freeze must remain byte-identical.
          test "$(git hash-object experiments/akron-2026/r1_t20_future_holdout_sources.json)" = "aec139abeb9c29cc3082f682faf6a16f7f09e3dd"
          # The post-hoc failure-localization receipt is fixed before this replay.
          test "$(git hash-object experiments/akron-2026/r1_t19b_spatial_anchor_audit.json)" = "00aa28a0c9f69f99175b0f3bd9a5ea62dbd396b9"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite and replay helper smoke gates
        shell: bash
        run: |
          set -euo pipefail
          pytest
          python experiments/akron-2026/evaluate_spatial_anchor_t19b_development.py --help >/dev/null
          python experiments/akron-2026/validate_spatial_anchor_t19b_development.py --help >/dev/null

      - name: Ensure bounded OCR capability is present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version | head -1

      - name: Rebuild canonical Akron parents and full attachment identity graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .akron-spatial-anchor-t19b-development akron-spatial-anchor-t19b-development
          mkdir -p akron-spatial-anchor-t19b-development
          proofline-onbase-attachments \
            --state-dir .akron-spatial-anchor-t19b-development \
            --manifest-out akron-spatial-anchor-t19b-development/attachment-manifest.json \
            --relations-out akron-spatial-anchor-t19b-development/discovered-relations.json \
            --rejections-out akron-spatial-anchor-t19b-development/rejections.json \
            experiments/akron-2026/onbase-plan.json \
            > akron-spatial-anchor-t19b-development/discovery.json
          test "$(sha256sum akron-spatial-anchor-t19b-development/attachment-manifest.json | awk '{print $1}')" = "7f3ad866a54c15c423589439826f45210a9be11a515e1886cf9e930ecda3e82a"
          test "$(python - <<'PY'
          import json
          print(len(json.load(open('akron-spatial-anchor-t19b-development/rejections.json'))))
          PY
          )" = "0"

      - name: Re-resolve opened T19b ranks 65-96
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/sync_t19_attachment_holdout.py \
            --state-dir .akron-spatial-anchor-t19b-development \
            --manifest akron-spatial-anchor-t19b-development/attachment-manifest.json \
            --relations akron-spatial-anchor-t19b-development/discovered-relations.json \
            --selection experiments/akron-2026/r1_t19_future_holdout_sources.json \
            --output akron-spatial-anchor-t19b-development/selection-sync.json \
            > akron-spatial-anchor-t19b-development/selection-sync-stdout.json

      - name: Replay T20 spatial anchor on exact T19b bytes
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/evaluate_spatial_anchor_t19b_development.py \
            --state-dir .akron-spatial-anchor-t19b-development \
            --selection-sync akron-spatial-anchor-t19b-development/selection-sync.json \
            --output akron-spatial-anchor-t19b-development/anchor-evaluation.json \
            --threshold 0.70 \
            --language eng \
            --dpi 200 \
            > akron-spatial-anchor-t19b-development/anchor-evaluation-stdout.json

      - name: Validate outcome-neutral development replay
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/validate_spatial_anchor_t19b_development.py \
            --evaluation akron-spatial-anchor-t19b-development/anchor-evaluation.json \
            --selection-sync akron-spatial-anchor-t19b-development/selection-sync.json \
            --summary-out akron-spatial-anchor-t19b-development/summary.json
          cat akron-spatial-anchor-t19b-development/summary.json

      - name: Upload T19b post-hoc spatial-anchor development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-spatial-anchor-t19b-development
          path: akron-spatial-anchor-t19b-development/
          if-no-files-found: error
          retention-days: 14
