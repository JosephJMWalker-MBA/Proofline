name: r1-akron-onbase-probe

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-onbase-probe.yml"
      - "experiments/akron-2026/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe bounded official OnBase page shells
        run: |
          python experiments/akron-2026/probe_onbase.py akron-probe-results | tee akron-probe-results-summary.json
          test -s akron-probe-results/probe.json

      - name: Probe publisher-declared search, agenda-tree, item, and PDF routes
        run: |
          python experiments/akron-2026/probe_onbase_data.py akron-data-probe-results | tee akron-data-probe-results-summary.json
          test -s akron-data-probe-results/data-probe.json
          python - <<'PY'
          import json
          p = json.load(open('akron-data-probe-results/data-probe.json'))
          counts = p['counts']
          assert counts['expected_pdf_samples'] >= 1
          assert counts['pdf_magic_downloads'] == counts['expected_pdf_samples']
          for row in p['agenda_samples']:
              if row['agenda_unique_name']:
                  assert row['agenda_pdf']['ok'] is True
                  assert row['agenda_pdf']['is_pdf_magic'] is True
                  assert '/Documents/DownloadFileBytes/' in row['agenda_pdf']['requested_url']
          PY

      - name: Upload source-contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-onbase-probe
          path: |
            akron-probe-results/
            akron-probe-results-summary.json
            akron-data-probe-results/
            akron-data-probe-results-summary.json
          if-no-files-found: error
          retention-days: 14
