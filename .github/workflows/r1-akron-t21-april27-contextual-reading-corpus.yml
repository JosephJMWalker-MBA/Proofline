name: r1-akron-t21-april27-contextual-reading-corpus

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-t21-april27-contextual-reading-corpus.yml"
      - "experiments/akron-2026/export_t21_april27_contextual_reading_corpus.py"
      - "experiments/akron-2026/r1_t21_april27_contextual_reading_population.json"
      - "experiments/akron-2026/r1_t21_april27_supporting_document_selection.json"
      - "experiments/akron-2026/acquire_t21_april27_supporting_documents.py"
      - "src/proofline/ocr.py"
      - "src/proofline/progressive.py"
      - "src/proofline/review.py"
      - "src/proofline/onbase_attachments.py"
      - "tests/test_t21_april27_contextual_reading_population.py"
      - "tests/test_t21_april27_contextual_reading_export.py"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify frozen reading population and machinery
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/akron-2026/r1_t21_april27_contextual_reading_population.json)" = "b35e64aba3ca607c231328a1395b0160166521a8"
          test "$(git hash-object experiments/akron-2026/r1_t21_april27_supporting_document_selection.json)" = "cd197f9e39d110f724a6c4437b311c1d86e9d904"
          test "$(git hash-object experiments/akron-2026/acquire_t21_april27_supporting_documents.py)" = "2af981af1a0f1e2624af2fe0d95d14ba9f6c4212"
          test "$(git hash-object experiments/akron-2026/export_t21_april27_contextual_reading_corpus.py)" = "e8f4d1d45f2988757e51a6b829d6ed7b845456c9"
          test "$(git hash-object tests/test_t21_april27_contextual_reading_export.py)" = "9006d5d8961e53fd300627b4bd5d6017eb40416c"
          test "$(git hash-object src/proofline/ocr.py)" = "8337c251aa8facd3074242c6c375136146c1e2e3"
          test "$(git hash-object src/proofline/progressive.py)" = "4c65f7840271fffd3fa8afa7b8d45a40ad2481d5"
          test "$(git hash-object src/proofline/review.py)" = "4bd49ce877178d294167074cbb1aa31e6ed49e4b"
          test "$(git hash-object src/proofline/onbase_attachments.py)" = "629421673d8d7a47ab0580c6e0f08cbc2d62ea26"
          test "$(git hash-object src/proofline/onbase_attachments_cli.py)" = "eb3ec92694a877a6b4365db04271974392e9a402"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite and exporter smoke gate
        shell: bash
        run: |
          set -euo pipefail
          pytest
          python experiments/akron-2026/export_t21_april27_contextual_reading_corpus.py --help >/dev/null

      - name: Ensure OCR capability is present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version | head -1

      - name: Rebuild canonical Akron parents and attachment relation graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .akron-t21-april27-contextual-reading akron-t21-april27-contextual-reading
          mkdir -p akron-t21-april27-contextual-reading
          proofline-onbase-attachments \
            --state-dir .akron-t21-april27-contextual-reading \
            --manifest-out akron-t21-april27-contextual-reading/attachment-manifest.json \
            --relations-out akron-t21-april27-contextual-reading/discovered-relations.json \
            --rejections-out akron-t21-april27-contextual-reading/rejections.json \
            experiments/akron-2026/onbase-plan.json \
            > akron-t21-april27-contextual-reading/discovery.json
          test "$(sha256sum akron-t21-april27-contextual-reading/attachment-manifest.json | awk '{print $1}')" = "7f3ad866a54c15c423589439826f45210a9be11a515e1886cf9e930ecda3e82a"
          test "$(python - <<'PY'
          import json
          print(len(json.load(open('akron-t21-april27-contextual-reading/rejections.json'))))
          PY
          )" = "0"

      - name: Prove exact 20-document reading population before text export
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          path = Path('experiments/akron-2026/export_t21_april27_contextual_reading_corpus.py')
          spec = importlib.util.spec_from_file_location('t21_reading', path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          population = json.load(open('experiments/akron-2026/r1_t21_april27_contextual_reading_population.json'))
          selection = json.load(open('experiments/akron-2026/r1_t21_april27_supporting_document_selection.json'))
          relations = json.load(open('akron-t21-april27-contextual-reading/discovered-relations.json'))
          manifest = json.load(open('akron-t21-april27-contextual-reading/attachment-manifest.json'))
          rows, verified, bounded = module.verify_inputs(
              population=population,
              selection=selection,
              relations=relations,
              attachment_manifest=manifest,
          )
          assert len(rows) == 20
          assert len(verified) == 20
          assert len(bounded.resources) == 20
          assert [row['publish_id'] for row in rows] == list(range(102587, 102607))
          PY

      - name: Reacquire exact Bronze and export preferred reading corpus
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/export_t21_april27_contextual_reading_corpus.py \
            --state-dir .akron-t21-april27-contextual-reading \
            --population experiments/akron-2026/r1_t21_april27_contextual_reading_population.json \
            --selection experiments/akron-2026/r1_t21_april27_supporting_document_selection.json \
            --relations akron-t21-april27-contextual-reading/discovered-relations.json \
            --attachment-manifest akron-t21-april27-contextual-reading/attachment-manifest.json \
            --threshold 0.70 \
            --language eng \
            --dpi 200 \
            --output akron-t21-april27-contextual-reading/reading-corpus.json \
            > akron-t21-april27-contextual-reading/reading-corpus-stdout.json
          cat akron-t21-april27-contextual-reading/reading-corpus-stdout.json

      - name: Validate reading corpus accounting and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p = json.load(open('akron-t21-april27-contextual-reading/reading-corpus.json'))
          assert p['schema'] == 'proofline-akron-t21-april27-contextual-reading-corpus/v1'
          assert p['stage'] == 'exact_family_pre_human_contextual_audit'
          assert len(p['documents']) == 20
          assert [d['publish_id'] for d in p['documents']] == list(range(102587, 102607))
          assert p['preferred']['page_count'] == 88
          assert p['ocr'] == {
              'added': 41,
              'attempted': 41,
              'candidates': 88,
              'failed': 0,
              'skipped': 47,
          }
          assert p['preferred']['method_counts'] == {
              'pymupdf_native_text': 47,
              'pymupdf_tesseract_ocr': 41,
          }
          assert p['preferred']['nonblank_page_count'] == 87
          assert p['preferred']['quality_floor_page_count'] == 87
          assert p['authority_boundary'] == {
              'machine_contextual_interpretation_performed': False,
              'event_identity_assigned': False,
              'meeting_occurrence_asserted': False,
              'hearing_occurrence_asserted': False,
              'outcome_assigned': False,
              'source_relation_created': False,
              'source_family_modified': False,
              'detector_authorized': False,
              'lead_count': None,
          }
          PY

      - name: Upload exact 20-document contextual reading corpus
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-t21-april27-contextual-reading-corpus
          path: |
            akron-t21-april27-contextual-reading/reading-corpus.json
            akron-t21-april27-contextual-reading/reading-corpus-stdout.json
            akron-t21-april27-contextual-reading/discovery.json
            akron-t21-april27-contextual-reading/attachment-manifest.json
            akron-t21-april27-contextual-reading/discovered-relations.json
            akron-t21-april27-contextual-reading/rejections.json
            experiments/akron-2026/r1_t21_april27_contextual_reading_population.json
            experiments/akron-2026/r1_t21_april27_supporting_document_selection.json
          if-no-files-found: error
          retention-days: 14
