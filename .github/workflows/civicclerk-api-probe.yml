name: civicclerk-api-probe

on:
  pull_request:
    paths:
      - ".github/workflows/civicclerk-api-probe.yml"
      - "scripts/probe_civicclerk_api.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe CivicClerk public event and file API
        run: |
          mkdir -p civicclerk-probe
          python scripts/probe_civicclerk_api.py > civicclerk-probe/civicclerk-api.json
          test -s civicclerk-probe/civicclerk-api.json

      - name: Assert event metadata is publicly reachable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('civicclerk-probe/civicclerk-api.json').read_text())
          print(f"events: {payload['event_count']}")
          print(f"successful event responses: {payload['successful_event_responses']}")
          print(f"file-like records: {payload['file_candidate_count']}")
          print(f"successful stream probes: {payload['successful_stream_probes']}")
          if payload['successful_event_responses'] == 0:
              raise SystemExit('CivicClerk event metadata endpoint was not publicly reachable')
          PY

      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civicclerk-api-probe
          path: civicclerk-probe/
          if-no-files-found: error
          retention-days: 7
