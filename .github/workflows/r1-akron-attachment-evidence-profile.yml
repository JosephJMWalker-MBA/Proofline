name: r1-akron-attachment-evidence-profile

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-attachment-evidence-profile.yml"
      - "experiments/akron-2026/profile_attachment_evidence.py"
      - "experiments/akron-2026/onbase-plan.json"
      - "src/proofline/onbase_attachments.py"
      - "src/proofline/progressive.py"
      - "src/proofline/ocr.py"
      - "src/proofline/structured.py"
      - "src/proofline/review.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest

      - name: Ensure bounded OCR capability is present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version | head -1

      - name: Build bounded production attachment state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p akron-attachment-profile
          proofline-onbase-attachments \
            --state-dir .akron-attachment-profile \
            --manifest-out akron-attachment-profile/attachment-manifest.json \
            --relations-out akron-attachment-profile/discovered-relations.json \
            --rejections-out akron-attachment-profile/rejections.json \
            --sync-limit 8 \
            experiments/akron-2026/onbase-plan.json \
            > akron-attachment-profile/sync.json

      - name: Profile native evidence, bounded OCR escalation, and structured facts
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/profile_attachment_evidence.py \
            --state-dir .akron-attachment-profile \
            --output akron-attachment-profile/evidence-profile.json \
            --threshold 0.70 \
            --ocr \
            --language eng \
            --dpi 200 \
            > akron-attachment-profile/profile-stdout.json

      - name: Validate measurement boundaries without requiring a positive financial result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('akron-attachment-profile')
          sync = json.loads((root / 'sync.json').read_text())
          profile = json.loads((root / 'evidence-profile.json').read_text())
          rejections = json.loads((root / 'rejections.json').read_text())

          if profile.get('schema') != 'proofline-akron-attachment-evidence-profile/v1':
              raise SystemExit('unexpected T8 profile schema')
          if rejections:
              raise SystemExit(f'T8 bounded state contains rejected publisher attachment links: {len(rejections)}')

          attachment_sync = sync.get('attachment_sync') or {}
          counts = (attachment_sync.get('watch') or {}).get('counts') or {}
          if attachment_sync.get('resource_count') != 8:
              raise SystemExit(f"T8 sample changed size: {attachment_sync.get('resource_count')}")
          if counts.get('new') != 8 or counts.get('unavailable') != 0:
              raise SystemExit(f'T8 fresh bounded attachment sync failed: {counts}')

          sample = profile['sample']
          if sample['attachment_count'] != 8:
              raise SystemExit(f"profile did not cover all 8 bounded attachment sources: {sample['attachment_count']}")
          if sample['relation_count'] != 8:
              raise SystemExit(f"fresh bounded state should contain 8 relation receipts: {sample['relation_count']}")

          attachments = profile['attachments']
          if len(attachments) != 8:
              raise SystemExit('attachment detail count differs from sample count')
          if any(item['artifact']['media_type'] != 'application/pdf' for item in attachments):
              raise SystemExit('non-PDF evidence entered the bounded attachment profile')
          if any('/Documents/DownloadFile/' not in item['source_uri'] for item in attachments):
              raise SystemExit('profile lost stable DownloadFile source identity')
          if any('/Meetings/ViewMeetingAgendaItem?' not in item['parent_source_uri'] for item in attachments):
              raise SystemExit('profile lost canonical agenda-item parent provenance')

          native = profile['native']
          post = profile['post_ocr']
          ocr = profile['ocr']
          if native['page_count'] < 8:
              raise SystemExit(f"bounded PDFs unexpectedly contain fewer than 8 pages total: {native['page_count']}")
          if post['page_count'] != native['page_count']:
              raise SystemExit('OCR changed logical page identity')
          if post['nonblank_page_count'] < native['nonblank_page_count']:
              raise SystemExit('preferred extraction lost nonblank native page evidence after OCR')
          if post['low_quality_page_count'] > native['low_quality_page_count']:
              raise SystemExit('quality-gated OCR increased low-quality preferred page count')
          if ocr['failed'] != 0:
              raise SystemExit(f"bounded OCR produced failures: {ocr['failures']}")
          if ocr['pages_attempted'] != native['low_quality_page_count']:
              raise SystemExit(
                  'OCR attempt count differs from the native low-quality page population'
              )

          native_facts = native['facts']
          post_facts = post['facts']
          if post_facts['fact_count'] < native_facts['fact_count']:
              raise SystemExit('preferred OCR caused deterministic structured facts to disappear')

          # No minimum money/date/identifier count is asserted. A null financial result is a
          # legitimate measurement and must not be tuned away. The gate only verifies that any
          # reported facts stay bound to the eight sampled attachment artifacts.
          attachment_artifacts = {item['artifact']['artifact_id'] for item in attachments}
          for kind in ('money', 'dates'):
              for fact in post_facts[kind]:
                  if fact['artifact_id'] not in attachment_artifacts:
                      raise SystemExit(f'{kind} fact escaped the bounded attachment artifact set')

          summary = {
              'attachment_count': sample['attachment_count'],
              'page_count': native['page_count'],
              'native_nonblank_page_count': native['nonblank_page_count'],
              'native_low_quality_page_count': native['low_quality_page_count'],
              'documents_needing_ocr': native['documents_needing_ocr'],
              'ocr_pages_attempted': ocr['pages_attempted'],
              'ocr_extractions_added': ocr['extractions_added'],
              'post_ocr_nonblank_page_count': post['nonblank_page_count'],
              'post_ocr_low_quality_page_count': post['low_quality_page_count'],
              'native_fact_type_counts': native_facts['fact_type_counts'],
              'post_ocr_fact_type_counts': post_facts['fact_type_counts'],
              'native_money_fact_count': len(native_facts['money']),
              'post_ocr_money_fact_count': len(post_facts['money']),
              'money_facts_added_by_preferred_ocr': post['money_facts_added_by_preferred_ocr'],
              'post_ocr_date_fact_count': len(post_facts['dates']),
              'preferred_method_counts': post['preferred_method_counts'],
              'tesseract_version': ocr['tesseract_version'],
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload bounded attachment evidence profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-attachment-evidence-profile
          path: akron-attachment-profile/
          if-no-files-found: error
          retention-days: 14
