name: r1-akron-local-grouping-holdout

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-local-grouping-holdout.yml"
      - "experiments/akron-2026/r1_t19_future_holdout_sources.json"
      - "experiments/akron-2026/R1_T19_REPRESENTATION_FREEZE.md"
      - "experiments/akron-2026/sync_t19_attachment_holdout.py"
      - "experiments/akron-2026/evaluate_local_grouping_holdout.py"
      - "experiments/akron-2026/validate_local_grouping_holdout.py"
      - "experiments/akron-2026/onbase-plan.json"
      - "src/proofline/local_grouping.py"
      - "src/proofline/local_layout.py"
      - "src/proofline/spatial_text.py"
      - "src/proofline/onbase_attachments.py"
      - "src/proofline/progressive.py"
      - "src/proofline/ocr.py"
      - "src/proofline/structured.py"
      - "tests/test_t19_holdout_machine.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify frozen T19 representation and holdout inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/akron-2026/r1_t19_future_holdout_sources.json)" = "f604f63fa995a3e80c4204668e14ec02629ac726"
          test "$(git hash-object src/proofline/local_grouping.py)" = "c931c7ea631444f18fa780164deadd126bd47160"
          test "$(git hash-object experiments/akron-2026/R1_T19_REPRESENTATION_FREEZE.md)" = "db5e8b97b63a0a228b43db5cdafbb8138efdd724"
          test "$(git hash-object experiments/akron-2026/r1_t19_local_grouping_development_summary.json)" = "417c523e1879cdc69420d3a3112441ad133d0cbe"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite and helper smoke gates
        run: pytest

      - name: Ensure bounded OCR capability is present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version | head -1

      - name: Rebuild canonical Akron parents and full attachment identity graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .akron-local-grouping-holdout akron-local-grouping-holdout
          mkdir -p akron-local-grouping-holdout
          proofline-onbase-attachments \
            --state-dir .akron-local-grouping-holdout \
            --manifest-out akron-local-grouping-holdout/attachment-manifest.json \
            --relations-out akron-local-grouping-holdout/discovered-relations.json \
            --rejections-out akron-local-grouping-holdout/rejections.json \
            experiments/akron-2026/onbase-plan.json \
            > akron-local-grouping-holdout/discovery.json
          test "$(sha256sum akron-local-grouping-holdout/attachment-manifest.json | awk '{print $1}')" = "7f3ad866a54c15c423589439826f45210a9be11a515e1886cf9e930ecda3e82a"
          test "$(python - <<'PY'
          import json
          print(len(json.load(open('akron-local-grouping-holdout/rejections.json'))))
          PY
          )" = "0"

      - name: Resolve and sync frozen ranks 65-96 holdout
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/sync_t19_attachment_holdout.py \
            --state-dir .akron-local-grouping-holdout \
            --manifest akron-local-grouping-holdout/attachment-manifest.json \
            --relations akron-local-grouping-holdout/discovered-relations.json \
            --selection experiments/akron-2026/r1_t19_future_holdout_sources.json \
            --output akron-local-grouping-holdout/selection-sync.json \
            > akron-local-grouping-holdout/selection-sync-stdout.json

      - name: Apply frozen local-grouping v1 to holdout
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/evaluate_local_grouping_holdout.py \
            --state-dir .akron-local-grouping-holdout \
            --selection-sync akron-local-grouping-holdout/selection-sync.json \
            --output akron-local-grouping-holdout/grouping-evaluation.json \
            --threshold 0.70 \
            --language eng \
            --dpi 200 \
            > akron-local-grouping-holdout/grouping-evaluation-stdout.json

      - name: Validate raw machine result and semantic boundary
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/validate_local_grouping_holdout.py \
            --root akron-local-grouping-holdout \
            --evaluation akron-local-grouping-holdout/grouping-evaluation.json \
            --selection-sync akron-local-grouping-holdout/selection-sync.json \
            --summary-out akron-local-grouping-holdout/summary.json
          cat akron-local-grouping-holdout/summary.json

      - name: Upload frozen pre-audit T19 holdout machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-local-grouping-holdout
          path: akron-local-grouping-holdout/
          if-no-files-found: error
          retention-days: 14
