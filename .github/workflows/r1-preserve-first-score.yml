name: r1-preserve-first-score

on:
  pull_request:
    paths:
      - ".github/workflows/r1-preserve-first-score.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Download exact first-score artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9377585377/zip" > /tmp/r1-first-score.zip
          mkdir -p /tmp/r1-first-score
          unzip -q /tmp/r1-first-score.zip -d /tmp/r1-first-score

      - name: Verify first-score artifact identities
        run: |
          set -euo pipefail
          cd /tmp/r1-first-score
          echo "a4e9aeedc7ca933af56fb8c6eb6b6cf72387417da287ba51ea6813ba26b5efbd  evaluation.json" | sha256sum -c -
          echo "d835c66f3af27b645a11393eff55c74c9ff24893afc7292c3031834661de76f0  summary.json" | sha256sum -c -
          echo "9db5e748154518e750b3f78f076512e127b7256b1f36b14ab3e73e77d775bcd6  sync.json" | sha256sum -c -

      - name: Commit exact first-score files once
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          destination="experiments/canton-2026/retrieval/r1-first-score"
          if [[ -e "$destination/evaluation.json" ]]; then
            echo "First score already preserved; refusing to overwrite it."
            exit 0
          fi
          mkdir -p "$destination"
          cp /tmp/r1-first-score/evaluation.json "$destination/evaluation.json"
          cp /tmp/r1-first-score/summary.json "$destination/summary.json"
          cp /tmp/r1-first-score/sync.json "$destination/sync.json"

          git config user.name "proofline-ci"
          git config user.email "proofline-ci@users.noreply.github.com"
          git add "$destination"
          git commit -m "Preserve exact first R1 retrieval score"
          git push origin "HEAD:$HEAD_BRANCH"
