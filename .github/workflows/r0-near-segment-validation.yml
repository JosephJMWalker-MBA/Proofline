name: r0-near-segment-validation

on:
  pull_request:
    paths:
      - ".github/workflows/r0-near-segment-validation.yml"
      - "experiments/canton-2026/**"
      - "src/proofline/families.py"
      - "src/proofline/recurrence.py"
      - "src/proofline/recurrence_packets.py"
      - "src/proofline/segment_similarity.py"
      - "src/proofline/segments.py"
      - "src/proofline/structured.py"
      - "src/proofline/cli.py"
      - "tests/test_recurrence.py"
      - "tests/test_recurrence_packets.py"
      - "tests/test_segments.py"
      - "tests/test_segment_similarity.py"
      - "tests/test_cli_segment_similarity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Build live R0 corpus and agenda-item segments
        shell: bash
        run: |
          set -o pipefail
          mkdir -p near-results
          proofline --state-dir .near sync experiments/canton-2026/source-plan.json > near-results/sync.json
          proofline --state-dir .near segment experiments/canton-2026/segment-plan.json > near-results/segment-build.json

      - name: Find cross-family near-duplicate Board items
        shell: bash
        run: |
          set -o pipefail
          proofline --state-dir .near near-segments \
            --rule board-ordinance-items \
            --threshold 0.60 \
            --shingle-size 3 \
            --min-shared-shingles 3 \
            --max-shingle-frequency 64 \
            --limit 100 > near-results/near-board.json
          test -s near-results/near-board.json

      - name: Cluster recurrence candidates through the library boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from proofline.recurrence import SegmentRecurrenceClusterer

          result = SegmentRecurrenceClusterer('.near').find(
              rule_name='board-ordinance-items',
              threshold=0.60,
              shingle_size=3,
              min_shared_shingles=3,
              max_shingle_frequency=64,
              limit=None,
          )
          Path('near-results/recurrence-board.json').write_text(
              json.dumps(result.to_dict(), indent=2, sort_keys=True),
              encoding='utf-8',
          )
          PY
          test -s near-results/recurrence-board.json

      - name: Prove live segment and recurrence identities survive a rebuild
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          from proofline.recurrence import SegmentRecurrenceClusterer
          from proofline.segments import SegmentIndex, load_segmentation_plan

          state = Path('.near')
          plan = load_segmentation_plan('experiments/canton-2026/segment-plan.json')
          index = SegmentIndex(state)
          first_build = index.current_build()
          if first_build is None:
              raise SystemExit('segment index missing before stability check')

          def segment_ids():
              with sqlite3.connect(state / 'proofline.db') as connection:
                  return tuple(
                      row[0]
                      for row in connection.execute(
                          'SELECT segment_id FROM evidence_segments ORDER BY segment_id'
                      ).fetchall()
                  )

          def cluster_ids():
              result = SegmentRecurrenceClusterer(state).find(
                  rule_name='board-ordinance-items',
                  threshold=0.60,
                  shingle_size=3,
                  min_shared_shingles=3,
                  max_shingle_frequency=64,
                  limit=None,
              )
              return tuple(sorted(cluster.cluster_id for cluster in result.clusters))

          before_segments = segment_ids()
          before_clusters = cluster_ids()
          second_build = index.rebuild(plan)
          after_segments = segment_ids()
          after_clusters = cluster_ids()

          payload = {
              'first_build_id': first_build['build_id'],
              'second_build_id': second_build.build_id,
              'segment_count': len(before_segments),
              'cluster_count': len(before_clusters),
              'segment_ids_stable': before_segments == after_segments,
              'cluster_ids_stable': before_clusters == after_clusters,
          }
          Path('near-results/identity-stability.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          if first_build['build_id'] == second_build.build_id:
              raise SystemExit('rebuild unexpectedly reused the same build UUID')
          if not before_segments or not before_clusters:
              raise SystemExit('live stability check lacked segment or recurrence identities')
          if before_segments != after_segments:
              raise SystemExit('segment IDs changed across identical live rebuilds')
          if before_clusters != after_clusters:
              raise SystemExit('recurrence cluster IDs changed across identical live rebuilds')
          PY

      - name: Enrich stable recurrence clusters with evidence-local structured facts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from proofline.recurrence_packets import RecurrenceEvidencePacketBuilder

          result = RecurrenceEvidencePacketBuilder('.near').find(
              rule_name='board-ordinance-items',
              threshold=0.60,
              shingle_size=3,
              min_shared_shingles=3,
              max_shingle_frequency=64,
              limit=None,
          )
          Path('near-results/recurrence-fact-packets.json').write_text(
              json.dumps(result.to_dict(), indent=2, sort_keys=True),
              encoding='utf-8',
          )
          PY
          test -s near-results/recurrence-fact-packets.json

      - name: Assert candidate generation and fact packets remain evidence-local
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('near-results/near-board.json').read_text())
          recurrence = json.loads(Path('near-results/recurrence-board.json').read_text())
          stability = json.loads(Path('near-results/identity-stability.json').read_text())
          packets = json.loads(Path('near-results/recurrence-fact-packets.json').read_text())
          candidates = payload['candidates']
          clusters = recurrence['clusters']
          packet_rows = packets['packets']

          packet_fact_count = sum(
              len(occurrence['facts'])
              for packet in packet_rows
              for occurrence in packet['occurrences']
          )
          packets_with_facts = sum(
              1 for packet in packet_rows
              if any(occurrence['facts'] for occurrence in packet['occurrences'])
          )
          common_values = sum(
              len(packet['values_present_in_all_occurrences']) for packet in packet_rows
          )
          varying_values = sum(
              len(packet['values_not_present_in_all_occurrences']) for packet in packet_rows
          )

          print(f"segments: {payload['segment_count']}")
          print(f"possible all pairs: {payload['possible_all_pairs']}")
          print(f"candidate pairs compared: {payload['candidate_pairs_compared']}")
          print(f"matched near-duplicate candidates: {payload['matched_candidate_count']}")
          print(f"same-family pairs skipped: {payload['same_family_pairs_skipped']}")
          print(f"recurrence clusters: {recurrence['cluster_count']}")
          print(f"stable segment IDs: {stability['segment_ids_stable']}")
          print(f"stable recurrence IDs: {stability['cluster_ids_stable']}")
          print(f"recurrence packet facts: {packet_fact_count}")
          print(f"recurrence packets with facts: {packets_with_facts}")
          print(f"common fact values: {common_values}")
          print(f"varying fact values: {varying_values}")

          if payload['method'] != 'token_shingle_jaccard/v1':
              raise SystemExit(f"unexpected method: {payload['method']}")
          if recurrence['method'] != 'segment_recurrence_connected_components/v1':
              raise SystemExit(f"unexpected recurrence method: {recurrence['method']}")
          if packets['method'] != 'recurrence_evidence_packet/v1':
              raise SystemExit(f"unexpected packet method: {packets['method']}")
          if packets['recurrence_method'] != recurrence['method']:
              raise SystemExit('packet builder lost recurrence method provenance')
          if not stability['segment_ids_stable'] or not stability['cluster_ids_stable']:
              raise SystemExit('derived identities failed live rebuild stability check')
          if payload['segment_count'] < 100:
              raise SystemExit(f"Board segment coverage unexpectedly low: {payload['segment_count']}")
          if payload['candidate_pairs_compared'] >= payload['possible_all_pairs'] // 2:
              raise SystemExit('candidate generation regressed toward all-pairs comparison')
          if payload['same_family_pairs_skipped'] < 1:
              raise SystemExit('expected version-family suppression to be exercised')
          if payload['returned_candidate_count'] != len(candidates):
              raise SystemExit('near-segment returned count mismatch')
          if recurrence['candidate_edge_count'] != payload['matched_candidate_count']:
              raise SystemExit('recurrence clusterer did not consume the complete matched-edge set')
          if recurrence['cluster_count'] < 1 or recurrence['cluster_count'] >= recurrence['candidate_edge_count']:
              raise SystemExit('recurrence clustering did not produce a bounded cross-family grouping')
          if not any(cluster['family_count'] >= 3 for cluster in clusters):
              raise SystemExit('expected at least one recurrence spanning three publisher contexts')

          if packets['cluster_count'] != recurrence['cluster_count']:
              raise SystemExit('packet result lost recurrence cluster count')
          if packets['returned_packet_count'] != len(packet_rows):
              raise SystemExit('packet returned count mismatch')
          recurrence_ids = {cluster['cluster_id'] for cluster in clusters}
          packet_ids = {packet['cluster']['cluster_id'] for packet in packet_rows}
          if packet_ids != recurrence_ids:
              raise SystemExit('packet builder changed stable recurrence cluster identity')
          if packet_fact_count < 1 or packets_with_facts < 1:
              raise SystemExit('live recurrence packets unexpectedly contain no structured facts')

          for packet in packet_rows:
              if not packet['limitations'] or 'not a Gold observation' not in packet['limitations'][-1]:
                  raise SystemExit('packet lost non-Gold semantic limitation')
              for occurrence_packet in packet['occurrences']:
                  segment = occurrence_packet['occurrence']['segment']
                  for fact in occurrence_packet['facts']:
                      if fact['evidence_id'] != segment['evidence_id']:
                          raise SystemExit('packet fact crossed evidence identity')
                      if not (
                          segment['char_start'] <= fact['char_start']
                          < fact['char_end'] <= segment['char_end']
                      ):
                          raise SystemExit('packet fact escaped segment span')
                      if fact['segment_relative_start'] != fact['char_start'] - segment['char_start']:
                          raise SystemExit('packet relative start is inconsistent')
                      if fact['segment_relative_end'] != fact['char_end'] - segment['char_start']:
                          raise SystemExit('packet relative end is inconsistent')
          PY

      - name: Upload near-duplicate evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-near-segment-results
          path: near-results/
          if-no-files-found: error
          retention-days: 7
