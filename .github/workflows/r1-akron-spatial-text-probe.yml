name: r1-akron-spatial-text-probe

on:
  pull_request:
    paths:
      - ".github/workflows/r1-akron-spatial-text-probe.yml"
      - "experiments/akron-2026/profile_spatial_text.py"
      - "experiments/akron-2026/r1_t13b_disjoint_attachment_sources.json"
      - "experiments/akron-2026/r1_t13b_source_artifact_map.json"
      - "experiments/akron-2026/r1_t14_known_amount_type_audit.json"
      - "experiments/akron-2026/r1_t16_native_structure_summary.json"
      - "experiments/akron-2026/R1_T17_SPATIAL_TEXT_PROBE.md"
      - "experiments/akron-2026/r1_t17_spatial_text_summary.json"
      - "experiments/akron-2026/sync_frozen_attachment_holdout.py"
      - "experiments/akron-2026/onbase-plan.json"
      - "src/proofline/spatial_text.py"
      - "src/proofline/hashing.py"
      - "src/proofline/onbase_attachments.py"
      - "src/proofline/onbase_attachments_cli.py"
      - "src/proofline/storage.py"
      - "src/proofline/watch_storage.py"
      - "src/proofline/structured.py"
      - "tests/test_spatial_text.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest

      - name: Ensure bounded OCR capability is present
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version | head -1

      - name: Rebuild canonical Akron parents and full attachment identity graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .akron-spatial-text akron-spatial-text
          mkdir -p akron-spatial-text
          proofline-onbase-attachments \
            --state-dir .akron-spatial-text \
            --manifest-out akron-spatial-text/attachment-manifest.json \
            --relations-out akron-spatial-text/discovered-relations.json \
            --rejections-out akron-spatial-text/rejections.json \
            experiments/akron-2026/onbase-plan.json \
            > akron-spatial-text/discovery.json
          test "$(sha256sum akron-spatial-text/attachment-manifest.json | awk '{print $1}')" = "7f3ad866a54c15c423589439826f45210a9be11a515e1886cf9e930ecda3e82a"

      - name: Sync exact already-opened T13b ranks 33-64 source set
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/sync_frozen_attachment_holdout.py \
            --state-dir .akron-spatial-text \
            --manifest akron-spatial-text/attachment-manifest.json \
            --relations akron-spatial-text/discovered-relations.json \
            --selection experiments/akron-2026/r1_t13b_disjoint_attachment_sources.json \
            --output akron-spatial-text/selection-sync.json \
            > akron-spatial-text/selection-sync-stdout.json

      - name: Profile common native and OCR word geometry
        shell: bash
        run: |
          set -euo pipefail
          python experiments/akron-2026/profile_spatial_text.py \
            --state-dir .akron-spatial-text \
            --selection-sync akron-spatial-text/selection-sync.json \
            --audit experiments/akron-2026/r1_t14_known_amount_type_audit.json \
            --t16-summary experiments/akron-2026/r1_t16_native_structure_summary.json \
            --source-artifact-map experiments/akron-2026/r1_t13b_source_artifact_map.json \
            --language eng \
            --dpi 200 \
            --output akron-spatial-text/spatial-text-profile.json \
            > akron-spatial-text/spatial-text-profile-stdout.json

      - name: Validate provenance and non-semantic boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('akron-spatial-text')
          profile = json.loads((root / 'spatial-text-profile.json').read_text())
          rejections = json.loads((root / 'rejections.json').read_text())

          if profile.get('schema') != 'proofline-akron-t17-spatial-text-profile/v1':
              raise SystemExit('unexpected T17 spatial profile schema')
          if profile.get('stage') != 'post_hoc_common_spatial_text_capability_probe_on_opened_t13b_t14':
              raise SystemExit('T17 stage boundary changed')
          if rejections:
              raise SystemExit(f'T17 source graph contains rejected publisher links: {len(rejections)}')

          sample = profile['sample']
          if sample['source_identity_count'] != 32 or sample['unique_artifact_count'] != 28:
              raise SystemExit(f'T17 frozen population changed: {sample}')
          if sample['selection_signature_sha256'] != 'b0986198c10856b8235c87361dc54999f93c5bcb59514ca8ff26cf957db2b966':
              raise SystemExit('T17 source selection signature changed')
          if sample['source_artifact_mapping_signature_sha256'] != '797f8986110664bf23019536a3c9721c7e283cd81b730e3eb867459b34848edf':
              raise SystemExit('T17 Bronze map signature changed')
          if sample['exact_source_to_bronze_match_count'] != 32 or sample['bronze_byte_identity_drift_count'] != 0:
              raise SystemExit(f'T17 exact Bronze continuity failed: {sample}')
          if sample['status'] != 'already_opened_t13b_t14_development_data_not_new_holdout':
              raise SystemExit('T17 incorrectly claims a new holdout')

          contract = profile['spatial_contract']
          for key in ('canonical_silver_changed', 'sqlite_storage_changed', 'search_changed', 'structured_index_changed', 'financial_semantics_changed', 'event_identity_assigned', 'detector_authorized'):
              if contract.get(key) is not False:
                  raise SystemExit(f'T17 boundary changed: {key}={contract.get(key)!r}')
          if contract.get('lead_count') is not None:
              raise SystemExit('T17 emitted leads')
          if contract['target_spatial_page_count'] < 1:
              raise SystemExit('T17 emitted no target spatial pages')
          if contract['native_target_page_count'] < 1 or contract['ocr_target_page_count'] < 1:
              raise SystemExit('T17 did not exercise both native and OCR geometry')
          if contract['native_target_page_count'] + contract['ocr_target_page_count'] != contract['target_spatial_page_count']:
              raise SystemExit('T17 target page method accounting is inconsistent')
          if contract['ocr_language'] != 'eng' or contract['ocr_dpi'] != 200:
              raise SystemExit('T17 OCR provenance changed')

          audit = profile['post_hoc_t14_characterization']
          if audit['fee_schedule_group_count'] != 6 or len(audit['fee_schedule_groups']) != 6:
              raise SystemExit('T17 no longer measures all six frozen fee groups')
          for key in ('fee_schedule_complete_geometry_count', 'fee_schedule_x_band_separable_count'):
              value = audit[key]
              if not isinstance(value, int) or not 0 <= value <= 6:
                  raise SystemExit(f'T17 invalid outcome-neutral count {key}={value!r}')
          removed = sum(
              len(group['tokens_removed_as_t15_numeric_integrity_issue'])
              for group in audit['fee_schedule_groups']
          )
          if removed != 1:
              raise SystemExit(f'T17 expected exactly one T15-resolved token exclusion, found {removed}')

          assessment = audit['assessment']
          for key in ('target_money_match_count', 'cash_assessed_label_match_count'):
              value = assessment[key]
              if not isinstance(value, int) or value < 0:
                  raise SystemExit(f'T17 invalid assessment count {key}={value!r}')
          for key in ('same_line_label_value_pair_exists', 'same_line_label_left_of_value_pair_exists'):
              if not isinstance(assessment[key], bool):
                  raise SystemExit(f'T17 invalid assessment capability result {key}')

          pages = profile['spatial_pages']
          if len(pages) != contract['target_spatial_page_count']:
              raise SystemExit('T17 spatial-page accounting is incomplete')
          for page in pages:
              if not str(page['evidence_id']).startswith('evidence:'):
                  raise SystemExit('T17 spatial page lost canonical page evidence binding')
              if not str(page['spatial_id']).startswith('spatial:'):
                  raise SystemExit('T17 spatial page lost deterministic derivation identity')
              if page['source_text_method'] not in {'pymupdf_native_text', 'pymupdf_tesseract_ocr'}:
                  raise SystemExit(f"T17 unexpected source text method: {page['source_text_method']}")
              if page['word_count'] < 0 or page['line_count'] < 0:
                  raise SystemExit('T17 invalid spatial counts')

          summary = {
              'source_identity_count': sample['source_identity_count'],
              'unique_artifact_count': sample['unique_artifact_count'],
              'exact_source_to_bronze_match_count': sample['exact_source_to_bronze_match_count'],
              'bronze_byte_identity_drift_count': sample['bronze_byte_identity_drift_count'],
              'target_spatial_page_count': contract['target_spatial_page_count'],
              'native_target_page_count': contract['native_target_page_count'],
              'ocr_target_page_count': contract['ocr_target_page_count'],
              'total_word_count': contract['total_word_count'],
              'total_line_count': contract['total_line_count'],
              'fee_schedule_complete_geometry_count': audit['fee_schedule_complete_geometry_count'],
              'fee_schedule_x_band_separable_count': audit['fee_schedule_x_band_separable_count'],
              'assessment_target_money_match_count': assessment['target_money_match_count'],
              'assessment_cash_assessed_label_match_count': assessment['cash_assessed_label_match_count'],
              'assessment_same_line_label_value_pair_exists': assessment['same_line_label_value_pair_exists'],
              'assessment_same_line_label_left_of_value_pair_exists': assessment['same_line_label_left_of_value_pair_exists'],
              'detector_authorized': contract['detector_authorized'],
              'lead_count': contract['lead_count'],
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload T17 spatial-text evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-akron-spatial-text-probe
          path: akron-spatial-text/
          if-no-files-found: error
          retention-days: 14
