name: r0-canton-validation

on:
  pull_request:
    paths:
      - ".github/workflows/r0-canton-validation.yml"
      - "experiments/canton-2026/**"
      - "scripts/**"
      - "src/proofline/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and tests
        run: python -m pip install -e ".[dev]"

      - name: Initialize results directory
        run: mkdir -p r0-results

      - name: Run full test suite
        run: python -m pytest

      - name: Verify installed CLI
        run: |
          command -v proofline
          proofline --help >/dev/null
          python -m proofline.cli --help >/dev/null

      - name: Inspect official City Council archive link structure
        run: python scripts/inspect_canton_council_archive.py > r0-results/council-archive-links.json

      - name: Run Canton discovery and sync
        run: |
          python -m proofline.cli --state-dir .r0 sync experiments/canton-2026/source-plan.json | tee r0-results/sync.json
          test -s r0-results/sync.json

      - name: Assert live discovery and record stale pointer behavior
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          payload = json.loads(Path('r0-results/sync.json').read_text())
          resources = payload['discovery']['manifest']['resources']
          supporting = payload['discovery'].get('supporting_artifact_ids', [])
          archived = [r for r in resources if '/ArchivedAgenda/' in r['source_uri']]
          linked = payload.get('linked_resources', [])
          linked_watch = payload.get('linked_watch') or {'results': []}
          states = Counter(item.get('state') for item in linked_watch.get('results', []))

          print(f'discovered {len(resources)} current/archived watch resources')
          print(f'preserved {len(supporting)} supporting discovery artifacts')
          print(f'discovered {len(archived)} archived meeting resources')
          print(f'detected {len(linked)} pointer-PDF targets')
          print(f'pointer-target states: {dict(states)}')

          if len(resources) < 20:
              raise SystemExit(f'expected at least 20 discovered resources, got {len(resources)}')
          if not supporting:
              raise SystemExit('expected at least one preserved Previous Versions listing')
          if not archived:
              raise SystemExit('expected at least one archived meeting resource from Previous Versions')
          if len(linked) < 20:
              raise SystemExit(f'expected at least 20 pointer targets, got {len(linked)}')
          PY

      - name: Capture corpus status, review queue, and PDF diagnostics
        if: always()
        run: |
          if [ -f .r0/proofline.db ]; then
            python -m proofline.cli --state-dir .r0 status > r0-results/status.json || true
            python -m proofline.cli --state-dir .r0 review --limit 500 > r0-results/review.json || true
            python scripts/r0_summary.py .r0/proofline.db > r0-results/corpus-summary.json || true
            python scripts/r0_pdf_diagnostics.py .r0 > r0-results/pdf-diagnostics.json || true
            cp .r0/proofline.db r0-results/proofline.db
          fi
          if [ -f .r0/manifests/canton-2026-public-records.json ]; then
            cp .r0/manifests/canton-2026-public-records.json r0-results/discovered-manifest.json
          fi

      - name: Upload R0 evidence database and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-canton-results
          path: r0-results/
          if-no-files-found: error
          retention-days: 7
